<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MES Production Master</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            /* Professional Palette */
            --sidebar-width: 280px;
            --header-height: 60px;
            
            --bg-app: #F3F4F6;        /* Light Gray Background */
            --bg-sidebar: #111827;    /* Dark Navy Sidebar */
            --bg-card: #FFFFFF;
            
            --primary: #3B82F6;       /* Royal Blue */
            --primary-dark: #2563EB;
            --success: #10B981;       /* Emerald Green */
            --warning: #F59E0B;       /* Amber */
            --danger: #EF4444;        /* Red */
            --purple: #8B5CF6;        /* Violet for OT */
            
            --text-main: #1F2937;
            --text-light: #6B7280;
            --text-sidebar: #9CA3AF;
            
            --border: #E5E7EB;
            --radius: 8px;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --font-family: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        
        body {
            font-family: var(--font-family);
            background: var(--bg-app);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            font-size: 14px;
            display: flex;
        }

        /* ========== LEFT SIDEBAR (FIXED) ========== */
        .app-sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 20;
            transition: all 0.3s;
        }

        .sidebar-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
            color: white;
            gap: 10px;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-label {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-sidebar);
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        /* Stats Cards in Sidebar */
        .stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--text-sidebar); }
        .stat-row strong { color: white; }
        
        .shift-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .shift-item { text-align: center; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 4px; }
        .shift-item i { display: block; margin-bottom: 4px; font-size: 16px; }

        /* Action Buttons */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        
        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2);
        }

        /* ========== MAIN CONTENT (RIGHT) ========== */
        .app-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .app-header {
            height: var(--header-height);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        /* Toolbar / Config Bar */
        .config-bar {
            background: var(--bg-card);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 16px;
            align-items: end;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 9px 12px;
            background: #F9FAFB;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            transition: 0.2s;
        }
        .form-control:focus {
            background: white;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Package List Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Filters */
        .filter-row {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: white;
            padding: 10px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
        }

        /* PACKAGE CARD DESIGN */
        .line-header {
            font-weight: 700;
            color: var(--text-light);
            margin: 24px 0 12px 0;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }
        .line-header::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        .package-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 12px;
            display: grid;
            /* Grid layout: Image | Info | Status | Command */
            grid-template-columns: 80px 1fr 120px 280px;
            overflow: hidden;
            transition: all 0.2s;
            position: relative;
        }

        .package-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .package-card.selected {
            border: 2px solid var(--primary);
            background: #EFF6FF;
        }

        /* Card Columns */
        .col-img {
            background: #F3F4F6;
            display: flex; align-items: center; justify-content: center;
            border-right: 1px solid var(--border);
        }
        .pkg-img { width: 100%; height: 100%; object-fit: cover; }

        .col-info { padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .pkg-id { font-family: monospace; color: var(--text-light); font-size: 12px; }
        .pkg-style { font-weight: 700; color: var(--text-main); font-size: 15px; }
        
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .tag-line { background: #E5E7EB; color: #374151; }
        .tag-target { background: #DBEAFE; color: #1D4ED8; }
        .tag-color { border: 1px solid #E5E7EB; color: #4B5563; }

        .col-status {
            padding: 10px;
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #F9FAFB;
        }
        .qty-fraction { font-size: 16px; font-weight: 800; }
        .status-text { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-top: 4px; }
        
        /* Status Colors */
        .st-done .qty-fraction, .st-done .status-text { color: var(--success); }
        .st-miss .qty-fraction, .st-miss .status-text { color: var(--warning); }
        .st-over .qty-fraction, .st-over .status-text { color: var(--primary); }
        .st-pend .qty-fraction, .st-pend .status-text { color: var(--text-light); }
        
        .ot-badge {
            position: absolute; top: 0; right: 0;
            background: var(--purple); color: white;
            font-size: 9px; padding: 2px 6px;
            border-bottom-left-radius: 6px; font-weight: 700;
        }

        .col-cmd {
            padding: 12px;
            border-left: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 8px; justify-content: center;
            position: relative;
        }
        
        .col-cmd.disabled-overlay { opacity: 0.6; pointer-events: none; background: #F3F4F6; }
        .col-cmd.mode-ot { background: #F5F3FF; }

        .cmd-checkbox-wrapper { position: absolute; top: 12px; left: 12px; }
        .cmd-checkbox { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

        .cmd-controls { margin-left: 24px; display: flex; flex-direction: column; gap: 6px; }

        .segment-control { display: flex; background: #E5E7EB; padding: 3px; border-radius: 6px; }
        .segment-btn {
            flex: 1; border: none; background: transparent; padding: 6px; font-size: 11px; font-weight: 600;
            color: var(--text-light); cursor: pointer; border-radius: 4px;
        }
        .segment-btn.active { background: white; color: var(--text-main); box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .segment-btn.active.hc { color: var(--warning); }
        .segment-btn.active.ot { color: var(--purple); }

        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .hour-input {
            width: 60px; padding: 5px; text-align: center; border: 1px solid var(--border);
            border-radius: 4px; font-weight: 700; color: var(--primary);
        }

        .quick-options { display: flex; gap: 5px; }
        .btn-tiny {
            flex: 1; padding: 4px; font-size: 10px; border: 1px solid var(--purple); color: var(--purple);
            background: white; border-radius: 4px; font-weight: 600; cursor: pointer;
        }
        .btn-tiny.active { background: var(--purple); color: white; }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-success { background: var(--success); color: white; }
        .btn-warning { background: var(--warning); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn-ot { background: var(--purple); color: white; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }

        .btn-process {
            width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
        }
        .btn-process:disabled { background: var(--text-sidebar); box-shadow: none; cursor: not-allowed; }

        /* MODALS */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-box {
            background: white; width: 90%; max-width: 800px; border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); overflow: hidden;
            transform: scale(0.95); transition: 0.3s; max-height: 90vh; display: flex; flex-direction: column;
        }
        .modal-overlay.open .modal-box { transform: scale(1); }
        .modal-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #F9FAFB; }
        .modal-body { padding: 24px; overflow-y: auto; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; }

        /* Loader */
        .loader { width: 18px; height: 18px; border: 2px solid #E5E7EB; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }

        /* Progress Bar (Logic requires these classes) */
        .progress-container { background: #EFF6FF; border: 1px solid #BFDBFE; padding: 20px; border-radius: 8px; }
        .progress-info { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 700; color: #1E3A8A; }
        .progress-bar-wrapper { background: white; height: 24px; border-radius: 12px; overflow: hidden; border: 1px solid #DBEAFE; }
        .progress-bar-fill { height: 100%; background: var(--primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; transition: width 0.3s; }
        .progress-details { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; }
        .progress-current-item { margin-top: 5px; font-style: italic; font-size: 12px; color: var(--text-light); text-align: center; }

        /* Responsive */
        @media (max-width: 1024px) {
            .package-card { grid-template-columns: 80px 1fr 100px 240px; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: auto; }
            .app-sidebar { width: 100%; height: auto; }
            .app-main { height: auto; }
            .config-bar { grid-template-columns: 1fr; }
            .package-card { grid-template-columns: 70px 1fr; grid-template-rows: auto auto auto; }
            .col-img { grid-row: 1 / span 3; }
            .col-info { grid-column: 2; }
            .col-status { grid-column: 2; flex-direction: row; justify-content: flex-start; gap: 10px; border-left: none; padding-top: 0; }
            .col-cmd { grid-column: 2; border-left: none; padding-top: 0; }
            .cmd-checkbox-wrapper { top: -40px; }
        }
    </style>
</head>
<body>

<!-- SIDEBAR (FIXED LEFT) -->
<nav class="app-sidebar">
    <div class="sidebar-header">
        <i class="fas fa-industry"></i> MES PRO <span style="font-weight:400; font-size:12px; opacity:0.7">v2.5</span>
    </div>

    <div class="sidebar-content">
        <!-- Summary Stats Section -->
        <div class="sidebar-section">
            <div class="sidebar-label">Thống kê Batch</div>
            <div class="stat-card">
                <div class="stat-row"><span>Gói đã chọn:</span> <strong id="sumCount">0</strong></div>
                <div class="stat-row"><span>Tổng Target:</span> <strong id="sumQty">0</strong></div>
                <div class="stat-row"><span>Tổng giờ làm:</span> <strong id="sumHours">0h</strong></div>
                
                <div class="shift-grid">
                    <div class="shift-item">
                        <i class="fas fa-sun" style="color:#F59E0B"></i>
                        <span id="morningCount">0</span>
                    </div>
                    <div class="shift-item">
                        <i class="fas fa-moon" style="color:#8B5CF6"></i>
                        <span id="otCount">0</span>
                    </div>
                </div>
            </div>
            
            <!-- Hidden elements but required by JS logic -->
            <div class="hidden">
                <span id="totalCount">0</span>
                <span id="filteredCount">0</span>
            </div>
        </div>

        <!-- Quick Actions Section -->
        <div class="sidebar-section">
            <div class="sidebar-label">Thao tác nhanh</div>
            <div class="action-grid">
                <button class="btn btn-warning btn-sm" onclick="setAllToMorning()">Ca Sáng</button>
                <button class="btn btn-ot btn-sm" onclick="setAllToOT4h()">OT 4h</button>
            </div>
            <button class="btn btn-secondary btn-sm" style="width:100%" onclick="resetAllSelections()">
                <i class="fas fa-undo"></i> Reset lựa chọn
            </button>
        </div>

        <!-- Settings Section -->
        <div class="sidebar-section">
            <div class="sidebar-label">Cấu hình gửi</div>
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="globalFaToggle" checked style="width:16px; height:16px; accent-color: var(--success);">
                <span style="font-size:13px">Gửi lệnh FA</span>
                <i class="fas fa-robot" style="color:var(--success)"></i>
            </label>
        </div>
    </div>

    <div class="sidebar-footer">
        <button id="processBtn" class="btn btn-process btn-success" onclick="showBatchPreview()" disabled>
            <i class="fas fa-rocket"></i> XỬ LÝ HÀNG LOẠT
        </button>
    </div>
</nav>

<!-- MAIN APP AREA -->
<main class="app-main">
    <header class="app-header">
        <div style="font-weight: 700; color: var(--text-main);">Dashboard Sản Xuất</div>
        <div style="display: flex; gap: 10px;">
            <a href="https://input-hourly-target.vercel.app/" target="_blank" class="btn btn-sm btn-secondary" style="background:var(--primary); color:white; border:none">
                <i class="fas fa-keyboard"></i> Nhập Thủ Công
            </a>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="config-bar">
        <div class="form-group">
            <label><i class="fas fa-key"></i> API Access Key</label>
            <input type="password" id="apiKey" class="form-control" placeholder="Nhập API Key..." onchange="saveConfig()">
        </div>
        <div class="form-group">
            <label><i class="fas fa-building"></i> Factory</label>
            <select id="factory" class="form-control" onchange="saveConfig()">
                <option value="P2C1">P2C1 - Chuyền May</option>
                <option value="P2A1">P2A1</option>
                <option value="P2B1">P2B1</option>
                <option value="P2D1">P2D1</option>
            </select>
        </div>
        <div class="form-group">
            <label><i class="fas fa-calendar"></i> Date</label>
            <input type="date" id="dateSelect" class="form-control" onchange="saveConfig()">
        </div>
        <div>
            <button class="btn btn-primary" onclick="loadPackages()" style="height: 40px; width: 100%;">
                <i class="fas fa-sync-alt"></i> Tải Dữ Liệu
            </button>
        </div>
    </div>

    <!-- Content List -->
    <div class="content-area">
        <!-- Summary Banner (Restored to fix logic) -->
        <div id="loadingSummary" class="hidden" style="margin-bottom: 15px; background: white; padding: 10px 15px; border-radius: 8px; display: flex; gap: 20px; font-size: 13px; border: 1px solid var(--border);">
            <span><i class="fas fa-box"></i> Gói: <b id="summaryPackageCount">0</b></span>
            <span><i class="fas fa-bullseye"></i> Target: <b id="summaryTarget">0</b></span>
            <span id="summaryActualContainer"><i class="fas fa-check"></i> Thực tế: <b id="summaryActual">0</b> (<span id="summaryPercent">0</span>%)</span>
        </div>

        <div class="filter-row">
            <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm Style, Line, ID..." oninput="filterPackages()">
            <select id="lineFilter" class="form-control" style="width: auto;" onchange="filterPackages()">
                <option value="all">Tất cả Line</option>
            </select>
            <select id="statusFilter" class="form-control" style="width: auto;" onchange="filterPackages()">
                <option value="all">Trạng thái: Tất cả</option>
                <option value="pending">⚪ Chưa nhập</option>
                <option value="done">🟢 Đủ Target</option>
                <option value="over">🔵 Vượt Target</option>
                <option value="miss">🟠 Thiếu Target</option>
            </select>
            <button class="btn btn-success btn-sm" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none; margin-left: auto;">
                Chọn tất cả
            </button>
        </div>

        <div id="packageListContainer">
            <div style="text-align: center; padding: 60px; color: var(--text-light);">
                <i class="fas fa-cubes fa-3x" style="opacity: 0.2; margin-bottom: 20px;"></i>
                <p>Vui lòng nhập API Key và tải dữ liệu</p>
            </div>
        </div>
    </div>
</main>

<!-- PREVIEW MODAL -->
<div class="modal-overlay" id="batchPreviewModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 style="font-weight:700">Xác nhận Batch</h3>
            <button class="btn btn-sm btn-danger" onclick="closeBatchPreviewModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="batchPreviewContent">
            <div class="loader"></div> Đang tải preview...
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeBatchPreviewModal()">Hủy</button>
            <button class="btn btn-success" onclick="confirmBatchProcess()">Gửi Dữ Liệu</button>
        </div>
    </div>
</div>

<!-- RESULT MODAL -->
<div class="modal-overlay" id="resultModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 style="font-weight:700">Kết quả xử lý</h3>
            <button class="btn btn-sm btn-danger" onclick="closeResultModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="resultContent">
            <!-- JS fills this -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeResultModal()">Đóng</button>
            <button class="btn btn-primary" onclick="location.reload()">Làm mới</button>
        </div>
    </div>
</div>

<script>
    // ========== 1. GLOBAL VARIABLES ==========
    const API_URLS = {
        PACKAGE: "https://today-package.chiscoong-cloudflare-com.workers.dev/api/packages",
        PROD: "https://hourly-target.chiscoong-cloudflare-com.workers.dev/api/production",
        MODULE: "https://module-requests.chiscoong-cloudflare-com.workers.dev/opdetails",
        OT: "https://ot-requests.chiscoong-cloudflare-com.workers.dev/package/slot-summary",
        IMG_PROXY: "https://mes-proxy.vercel.app/api",
        SCANNER: "https://mes-qr-scanner.chiscoong-cloudflare-com.workers.dev/"
    };

    // Constants
    const LUNCH_SLOT_INDEX = 4;
    const OT_START_INDEX = 8;
    const timeSlots = [
        "07:15 - 08:15", "08:15 - 09:15", "09:15 - 10:15", "10:15 - 11:15", 
        "11:15 - 12:15", "12:15 - 13:15", "13:15 - 14:15", "14:15 - 15:15", 
        "15:15 - 16:15", "16:15 - 17:15", "17:15 - 18:15", "18:15 - 19:15", "19:15 - 20:15"
    ];

    // Data Management
    let allPackages = [];
    let batchSelected = new Set();
    let batchConfigs = {};
    let globalFaEnabled = true;

    // ========== 2. INITIALIZATION ==========
    document.addEventListener('DOMContentLoaded', function() {
        // Set default date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('dateSelect').value = today;
        
        // Load saved config
        if (localStorage.getItem('mesApiKey')) {
            document.getElementById('apiKey').value = localStorage.getItem('mesApiKey');
        }
        if (localStorage.getItem('mesFactory')) {
            document.getElementById('factory').value = localStorage.getItem('mesFactory');
        }
        
        // Event delegation setup
        setupEventDelegation();
        
        // Fix for Android desktop mode
        fixAndroidDesktopMode();
    });

    function fixAndroidDesktopMode() {
        // Prevent zoom on mobile
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, { passive: false });
        
        // Fix viewport scaling
        let metaViewport = document.querySelector('meta[name="viewport"]');
        metaViewport.content = metaViewport.content + ', maximum-scale=1.0, user-scalable=no';
        
        // Prevent elastic scrolling
        document.body.style.overscrollBehavior = 'none';
    }

    function setupEventDelegation() {
        const container = document.getElementById('packageListContainer');
        
        // Handle clicks on package cards (for checkbox toggling)
        container.addEventListener('click', function(e) {
            const card = e.target.closest('.package-card');
            if (!card) return;
            
            const pkgId = card.id.replace('card-', '');
            
            // If click is directly on checkbox, let the checkbox handle it
            if (e.target.type === 'checkbox' || e.target.closest('.cmd-checkbox')) {
                return;
            }
            
            // If click is on command center controls, let those handle it
            if (e.target.closest('.segment-btn') || 
                e.target.closest('.btn-tiny') || 
                e.target.closest('.hour-input')) {
                return;
            }
            
            // Otherwise, toggle the checkbox
            handleCardClick(pkgId);
        });
        
        // Handle checkbox changes
        container.addEventListener('change', function(e) {
            if (e.target.type === 'checkbox' && e.target.classList.contains('cmd-checkbox')) {
                const pkgId = e.target.closest('.package-card').id.replace('card-', '');
                handleCheckboxClick(e.target.checked, pkgId);
            }
            
            if (e.target.classList.contains('hour-input')) {
                const pkgId = e.target.closest('.package-card').id.replace('card-', '');
                updateHours(pkgId, e.target.value);
            }
        });
        
        // Handle button clicks in command center
        container.addEventListener('click', function(e) {
            // Shift buttons
            if (e.target.closest('.segment-btn')) {
                const btn = e.target.closest('.segment-btn');
                const pkgId = btn.closest('.package-card').id.replace('card-', '');
                const shiftType = btn.classList.contains('hc') ? 'morning' : 'ot';
                handleShiftButtonClick(pkgId, shiftType);
                e.stopPropagation();
            }
            
            // OT mode buttons
            if (e.target.closest('.btn-tiny')) {
                const btn = e.target.closest('.btn-tiny');
                const pkgId = btn.closest('.package-card').id.replace('card-', '');
                const otMode = btn.textContent.includes('4h') ? '4h' : '11h';
                handleOTModeClick(pkgId, otMode);
                e.stopPropagation();
            }
        });
    }

    // ========== 3. EVENT HANDLERS ==========
    function handleCardClick(pkgId) {
        const checkbox = document.querySelector(`#card-${pkgId} .cmd-checkbox`);
        if (checkbox) {
            const newState = !checkbox.checked;
            checkbox.checked = newState;
            handleCheckboxClick(newState, pkgId);
        }
    }

    function handleCheckboxClick(checked, pkgId) {
        const card = document.getElementById(`card-${pkgId}`);
        const cmd = document.getElementById(`cmd-${pkgId}`);
        
        if (checked) {
            batchSelected.add(pkgId);
            if (card) {
                card.classList.add('selected');
            }
            if (cmd) cmd.classList.remove('disabled-overlay');
            
            // Initialize default config if not exists
            if (!batchConfigs[pkgId]) {
                batchConfigs[pkgId] = { shift: 'morning', otMode: '4h', hours: 7.5 };
            }
            refreshCardUI(pkgId);
        } else {
            batchSelected.delete(pkgId);
            if (card) card.classList.remove('selected');
            if (cmd) cmd.classList.add('disabled-overlay');
        }
        
        updateSummary();
        updateSelectAllButton();
    }

    function handleShiftButtonClick(pkgId, shiftType) {
        // Make sure package is selected
        if (!batchSelected.has(pkgId)) {
            const checkbox = document.querySelector(`#card-${pkgId} .cmd-checkbox`);
            if (checkbox) {
                checkbox.checked = true;
                handleCheckboxClick(true, pkgId);
            }
        }
        
        if (!batchConfigs[pkgId]) {
            batchConfigs[pkgId] = { shift: 'morning', otMode: '4h', hours: 7.5 };
        }
        
        batchConfigs[pkgId].shift = shiftType;
        
        // Set default hours based on shift
        if (shiftType === 'morning') {
            batchConfigs[pkgId].hours = 7.5;
            batchConfigs[pkgId].otMode = '4h';
        } else {
            if (!batchConfigs[pkgId].otMode) {
                batchConfigs[pkgId].otMode = '4h';
            }
            batchConfigs[pkgId].hours = batchConfigs[pkgId].otMode === '4h' ? 4 : 11;
        }
        
        refreshCardUI(pkgId);
        updateSummary();
    }

    function handleOTModeClick(pkgId, otMode) {
        if (!batchConfigs[pkgId]) return;
        
        batchConfigs[pkgId].otMode = otMode;
        batchConfigs[pkgId].hours = otMode === '4h' ? 4 : 11;
        
        refreshCardUI(pkgId);
        updateSummary();
    }

    // ========== 4. UI UPDATES ==========
    function refreshCardUI(pkgId) {
        const cfg = batchConfigs[pkgId];
        if (!cfg) return;
        
        const cmd = document.getElementById(`cmd-${pkgId}`);
        if (!cmd) return;
        
        // Update shift buttons
        const hcBtn = cmd.querySelector('.hc');
        const otBtn = cmd.querySelector('.ot');
        if (hcBtn) hcBtn.classList.toggle('active', cfg.shift === 'morning');
        if (otBtn) otBtn.classList.toggle('active', cfg.shift === 'ot');
        
        // Update OT mode
        cmd.classList.toggle('mode-ot', cfg.shift === 'ot');
        
        const otOpts = document.getElementById(`ot-opts-${pkgId}`);
        if (otOpts) {
            otOpts.classList.toggle('hidden', cfg.shift !== 'ot');
            
            if (cfg.shift === 'ot') {
                otOpts.querySelectorAll('.btn-tiny').forEach(btn => btn.classList.remove('active'));
                const activeBtn = otOpts.querySelector(`.btn-tiny${cfg.otMode === '4h' ? ':first-child' : ':last-child'}`);
                if (activeBtn) activeBtn.classList.add('active');
            }
        }
        
        // Update hours input
        const input = document.getElementById(`input-${pkgId}`);
        if (input) input.value = cfg.hours;
    }

    function updateSelectAllButton() {
        const visibleCards = document.querySelectorAll('.package-card:not([style*="display: none"])');
        if (visibleCards.length === 0) {
            document.getElementById('selectAllBtn').style.display = 'none';
            return;
        }
        
        const allSelected = Array.from(visibleCards).every(card => 
            batchSelected.has(card.id.replace('card-', ''))
        );
        
        const btn = document.getElementById('selectAllBtn');
        btn.style.display = 'inline-flex';
        btn.innerHTML = allSelected ? 
            '<i class="fas fa-times"></i> Bỏ chọn tất cả' : 
            '<i class="fas fa-check-double"></i> Chọn tất cả';
    }

    function toggleSelectAll() {
        const visibleCards = document.querySelectorAll('.package-card:not([style*="display: none"])');
        const allSelected = Array.from(visibleCards).every(card => 
            batchSelected.has(card.id.replace('card-', ''))
        );
        
        visibleCards.forEach(card => {
            const pkgId = card.id.replace('card-', '');
            const checkbox = card.querySelector('.cmd-checkbox');
            
            if (!checkbox) return;
            
            if (allSelected) {
                // Unselect all
                if (batchSelected.has(pkgId)) {
                    checkbox.checked = false;
                    handleCheckboxClick(false, pkgId);
                }
            } else {
                // Select all unselected
                if (!batchSelected.has(pkgId)) {
                    checkbox.checked = true;
                    handleCheckboxClick(true, pkgId);
                }
            }
        });
    }

    // ========== 5. DATA LOADING FUNCTIONS ==========
    async function loadPackages() {
        const apiKey = document.getElementById('apiKey').value;
        const factory = document.getElementById('factory').value;
        const dateStr = document.getElementById('dateSelect').value.replace(/-/g, '');
        
        if (!apiKey) {
            Swal.fire('⚠️ API Key trống', 'Vui lòng nhập API Key để tiếp tục!', 'warning');
            return;
        }
        
        saveConfig();
        
        const container = document.getElementById('packageListContainer');
        container.innerHTML = '<div style="text-align:center; padding:30px;"><div class="loader" style="margin:0 auto"></div> Đang tải danh sách Package...</div>';
        
        // Reset selections
        batchSelected.clear();
        batchConfigs = {};
        document.getElementById('selectAllBtn').style.display = 'none';
        document.getElementById('loadingSummary').classList.add('hidden');
        
        try {
            const res = await fetch(`${API_URLS.PACKAGE}?factory=${factory}&fromDate=${dateStr}&apikey=${apiKey}`);
            const json = await res.json();
            const rawList = json.data?.packages || json.data || [];

            allPackages = rawList.map(p => {
                const pid = p.packageId || p.MXPACKAGE;
                return {
                    id: pid,
                    style: p.styleText || p.STYLETEXT || "N/A",
                    line: p.lineName || (p.remarks?.match(/LINE\s*([A-Za-z0-9]+)/i)?.[1]) || pid.split('_')[1] || "N/A",
                    target: parseInt(p.target || p.MXTARGET || 0),
                    color: p.color || p.COLOR || p.Color || "",
                    fileName: p.FileName || p.filename || null,
                    buyer: p.buyer || pid.split('_')[3]?.substring(0,3) || "N/A",
                    remarks: p.remarks || p.REMARKS || "",
                    actual: null,
                    hasOT: false,
                    loading: true,
                    searchStr: `${pid} ${p.styleText} ${p.lineName} ${p.color} ${p.remarks}`.toLowerCase()
                };
            });

            // Update counts
            const totalCount = allPackages.length;
            const totalTarget = allPackages.reduce((sum, p) => sum + p.target, 0);
            
            // Check if element exists before setting textContent
            const totalCountEl = document.getElementById('totalCount');
            if (totalCountEl) totalCountEl.textContent = totalCount;
            
            const filteredCountEl = document.getElementById('filteredCount');
            if (filteredCountEl) filteredCountEl.textContent = totalCount;
            
            // Update summary banner
            document.getElementById('summaryPackageCount').textContent = totalCount;
            document.getElementById('summaryTarget').textContent = totalTarget.toLocaleString();
            document.getElementById('summaryActual').textContent = "0";
            document.getElementById('summaryPercent').textContent = "0";
            document.getElementById('loadingSummary').classList.remove('hidden');
            
            populateLineFilter();
            renderPackageList(allPackages);
            updateSelectAllButton();
            
            // Sync statuses in background
            syncStatuses(allPackages, apiKey);

        } catch (e) {
            console.error('Load packages error:', e);
            container.innerHTML = `
                <div style="text-align:center; padding:30px; color:var(--danger);">
                    <i class="fas fa-exclamation-triangle fa-2x" style="margin-bottom:15px;"></i><br>
                    <strong>Lỗi tải dữ liệu:</strong><br>
                    ${e.message || "Không thể kết nối đến server"}
                </div>`;
        }
    }

    // ========== 6. FILTER FUNCTIONS ==========
    function populateLineFilter() {
        const lines = [...new Set(allPackages.map(p => p.line))].sort((a, b) => {
            const numA = (a.match(/(\d+)/)||[])[0] ? parseInt((a.match(/(\d+)/)||[])[0]) : 9999;
            const numB = (b.match(/(\d+)/)||[])[0] ? parseInt((b.match(/(\d+)/)||[])[0]) : 9999;
            return numA - numB;
        });
        
        const select = document.getElementById('lineFilter');
        select.innerHTML = '<option value="all">Tất cả Line</option>';
        lines.forEach(line => {
            select.innerHTML += `<option value="${line}">Line ${line}</option>`;
        });
    }

    function filterPackages() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const lineVal = document.getElementById('lineFilter').value;
        const statusVal = document.getElementById('statusFilter').value;
        
        const filtered = allPackages.filter(p => {
            // Line filter
            if (lineVal !== 'all' && p.line !== lineVal) return false;
            
            // Search term
            if (term && !p.searchStr.includes(term)) return false;
            
            // Status filter
            if (statusVal !== 'all') {
                if (p.loading) return statusVal === 'pending';
                
                const diff = p.actual - p.target;
                if (statusVal === 'pending') return p.actual === 0 || p.actual === null;
                if (statusVal === 'done') return diff === 0 && p.actual > 0;
                if (statusVal === 'over') return diff > 0;
                if (statusVal === 'miss') return diff < 0 && p.actual > 0;
            }
            
            return true;
        });
        
        const filteredCountEl = document.getElementById('filteredCount');
        if (filteredCountEl) filteredCountEl.textContent = filtered.length;
        renderPackageList(filtered);
    }

    // ========== 7. RENDERING FUNCTIONS ==========
    function renderPackageList(list) {
        const container = document.getElementById('packageListContainer');
        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-light);">Không tìm thấy package nào</div>';
            return;
        }

        // Use DocumentFragment for better performance
        const fragment = document.createDocumentFragment();
        let currentLine = null;
        let lineHeader = null;

        // Sort by line
        list.sort((a, b) => {
            const lineA = a.line.toUpperCase();
            const lineB = b.line.toUpperCase();
            const numA = (lineA.match(/(\d+)/)||[])[0] ? parseInt((lineA.match(/(\d+)/)||[])[0]) : 9999;
            const numB = (lineB.match(/(\d+)/)||[])[0] ? parseInt((lineB.match(/(\d+)/)||[])[0]) : 9999;
            return numA - numB;
        });

        list.forEach(p => {
            // Add line header if needed
            if (p.line !== currentLine) {
                currentLine = p.line;
                lineHeader = document.createElement('div');
                lineHeader.className = 'line-header';
                lineHeader.innerHTML = `<i class="fas fa-layer-group"></i> LINE ${currentLine}`;
                fragment.appendChild(lineHeader);
            }

            const isSelected = batchSelected.has(p.id);
            const config = batchConfigs[p.id] || { shift: 'morning', otMode: '4h', hours: 7.5 };
            const thumbUrl = generateThumbnailUrl(p.id, p.fileName);

            const card = document.createElement('div');
            card.className = `package-card ${isSelected ? 'selected' : ''}`;
            card.id = `card-${p.id}`;
            
            card.innerHTML = `
                <div class="col-img">
                    <img src="${thumbUrl}" class="pkg-img" 
                         onerror="this.src='https://placehold.co/100?text=No+Img'"
                         alt="${p.style}">
                </div>
                <div class="col-info">
                    <div class="pkg-id">${p.id}</div>
                    <div class="pkg-style">${p.style}</div>
                    <div class="tags">
                        <span class="tag tag-line">Line ${p.line}</span>
                        <span class="tag tag-target">Target: ${p.target}</span>
                        ${p.color ? `<span class="tag tag-color"><i class="fas fa-palette"></i> ${p.color}</span>` : ''}
                    </div>
                </div>
                <div class="col-status" id="status-${p.id}">
                    ${p.loading ? 
                        '<div class="loader"></div><div style="font-size:10px; color:#999; margin-top:5px">Đang tải...</div>' : 
                        '<div class="loader"></div><div style="font-size:10px; color:#999; margin-top:5px">Target: ' + p.target + '</div>'
                    }
                </div>
                <div class="col-cmd ${config.shift === 'ot' ? 'mode-ot' : ''} ${isSelected ? '' : 'disabled-overlay'}" id="cmd-${p.id}">
                    <div class="cmd-checkbox-wrapper">
                        <input type="checkbox" class="cmd-checkbox" 
                               ${isSelected ? 'checked' : ''}>
                    </div>
                    <div class="cmd-controls">
                        <div class="segment-control">
                            <button class="segment-btn hc ${config.shift === 'morning' ? 'active' : ''}">
                                <i class="fas fa-sun"></i> HC
                            </button>
                            <button class="segment-btn ot ${config.shift === 'ot' ? 'active' : ''}">
                                <i class="fas fa-moon"></i> OT
                            </button>
                        </div>
                        <div class="input-row">
                            <span style="font-size:11px; font-weight:700; color:var(--text-light)">Giờ:</span>
                            <input type="number" class="hour-input" id="input-${p.id}" 
                                value="${config.hours}" step="0.5" min="0.5" max="14">
                        </div>
                        <div class="quick-options ${config.shift === 'morning' ? 'hidden' : ''}" id="ot-opts-${p.id}">
                            <button class="btn-tiny ${config.otMode === '4h' ? 'active' : ''}">4h</button>
                            <button class="btn-tiny ${config.otMode === '11h' ? 'active' : ''}">11h</button>
                        </div>
                    </div>
                </div>
            `;

            fragment.appendChild(card);
        });

        container.innerHTML = '';
        container.appendChild(fragment);
        
        // Update status for already loaded packages
        list.forEach(p => {
            if (!p.loading) {
                updatePackageStatusUI(p);
            }
        });
        
        updateSummary();
        updateSelectAllButton();
    }

    // ========== 8. SYNC & STATUS FUNCTIONS ==========
    async function syncStatuses(list, apiKey) {
        const concurrencyLimit = 5;
        let activeRequests = 0;
        let index = 0;
        let grandTotalActual = 0;

        const processNext = async () => {
            if (index >= list.length) return;
            const p = list[index++];
            activeRequests++;

            try {
                // Get actual production data
                const resMod = await fetch(`${API_URLS.MODULE}?mxpackage=${p.id}&mode=summary&apikey=${apiKey}`);
                const jsonMod = await resMod.json();
                
                let actual = 0;
                if (jsonMod.success && jsonMod.data?.summary) {
                    actual = jsonMod.data.summary.total_manual_input || 0;
                }
                p.actual = actual;
                grandTotalActual += actual;
                
                // Check OT status
                try {
                    const resOT = await fetch(`${API_URLS.OT}?mxpackage=${p.id}&apikey=${apiKey}`);
                    const jsonOT = await resOT.json();
                    if (jsonOT.success && jsonOT.data?.slot_analysis) {
                        p.hasOT = jsonOT.data.slot_analysis.has_ot || false;
                    }
                } catch (otErr) {
                    console.warn(`OT check failed for ${p.id}:`, otErr);
                }

                p.loading = false;
                updatePackageStatusUI(p);
                
                // Update summary banner
                const totalTarget = list.reduce((sum, pkg) => sum + pkg.target, 0);
                const percent = totalTarget > 0 ? Math.floor((grandTotalActual/totalTarget)*100) : 0;
                document.getElementById('summaryActual').textContent = grandTotalActual.toLocaleString();
                document.getElementById('summaryPercent').textContent = percent;
                
                const actualContainer = document.getElementById('summaryActualContainer');
                actualContainer.style.color = percent >= 100 ? '#10B981' : (percent >= 50 ? '#F59E0B' : '#EF4444');

            } catch (err) {
                console.warn(`Status sync failed for ${p.id}:`, err);
                p.actual = 0;
                p.loading = false;
                updatePackageStatusUI(p);
            } finally {
                activeRequests--;
                processNext();
            }
        };

        for (let i = 0; i < Math.min(concurrencyLimit, list.length); i++) {
            processNext();
        }
    }

    function updatePackageStatusUI(p) {
        const statusEl = document.getElementById(`status-${p.id}`);
        if (!statusEl) return;

        // Calculate status
        let statusClass = 'st-pend';
        let statusText = 'Chưa nhập';
        let diff = 0;
        
        if (p.actual > 0) {
            diff = p.actual - p.target;
            if (diff === 0) {
                statusClass = 'st-done';
                statusText = 'Đủ';
            } else if (diff > 0) {
                statusClass = 'st-over';
                statusText = `Vượt ${diff}`;
            } else {
                statusClass = 'st-miss';
                statusText = `Thiếu ${Math.abs(diff)}`;
            }
        }

        // Update UI
        statusEl.className = `col-status ${statusClass}`;
        statusEl.innerHTML = `
            ${p.hasOT ? '<div class="ot-badge">OT</div>' : ''}
            <div class="status-display">
                <div class="qty-fraction">${p.actual} / ${p.target}</div>
                <div class="status-text">${statusText}</div>
            </div>
        `;
    }

    // ========== 9. UTILITY FUNCTIONS ==========
    function saveConfig() {
        localStorage.setItem('mesApiKey', document.getElementById('apiKey').value);
        localStorage.setItem('mesFactory', document.getElementById('factory').value);
    }

    function updateHours(pkgId, value) {
        const hours = parseFloat(value) || 0;
        if (hours <= 0) return;
        
        if (!batchConfigs[pkgId]) {
            batchConfigs[pkgId] = { shift: 'morning', otMode: '4h', hours: hours };
        } else {
            batchConfigs[pkgId].hours = hours;
        }
        updateSummary();
    }

    function setAllToMorning() {
        batchSelected.forEach(pkgId => {
            batchConfigs[pkgId] = { shift: 'morning', otMode: '4h', hours: 7.5 };
            refreshCardUI(pkgId);
        });
        updateSummary();
    }

    function setAllToOT4h() {
        batchSelected.forEach(pkgId => {
            batchConfigs[pkgId] = { shift: 'ot', otMode: '4h', hours: 4 };
            refreshCardUI(pkgId);
        });
        updateSummary();
    }

    function resetAllSelections() {
        batchSelected.clear();
        batchConfigs = {};
        renderPackageList(allPackages.filter(p => 
            document.getElementById(`card-${p.id}`)?.style.display !== 'none'
        ));
    }

    function updateSummary() {
        let totalPackages = 0;
        let totalQuantity = 0;
        let totalHours = 0;
        let morningCount = 0;
        let otCount = 0;
        
        batchSelected.forEach(pkgId => {
            const pkg = allPackages.find(p => p.id === pkgId);
            const cfg = batchConfigs[pkgId];
            
            if (pkg && cfg) {
                totalPackages++;
                totalQuantity += pkg.target;
                totalHours += cfg.hours;
                
                if (cfg.shift === 'morning') {
                    morningCount++;
                } else {
                    otCount++;
                }
            }
        });
        
        // Update UI
        document.getElementById('sumCount').textContent = totalPackages;
        document.getElementById('sumQty').textContent = totalQuantity.toLocaleString();
        document.getElementById('sumHours').textContent = totalHours.toFixed(1) + 'h';
        document.getElementById('morningCount').textContent = morningCount;
        document.getElementById('otCount').textContent = otCount;
        
        // Enable/disable process button
        document.getElementById('processBtn').disabled = totalPackages === 0;
    }

    function generateThumbnailUrl(pkgId, apiFileName) {
        if (!apiFileName) return 'https://placehold.co/150x200?text=No+Img';
        
        try {
            const parts = pkgId.split('_');
            if (parts.length < 4) return 'https://placehold.co/150x200?text=Invalid';

            const stylePart = parts[3];
            const styleFolder = stylePart.substring(0, 7).toUpperCase(); 
            const buyer = stylePart.substring(0, 3).toUpperCase();

            const fullUrl = `${API_URLS.IMG_PROXY}/PKPDM/style/${buyer}/${styleFolder}/Images/${apiFileName}`;
            return `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=250&output=webp&q=85`;
        } catch(e) {
            console.error("Error generating thumb:", e);
            return 'https://placehold.co/150x200?text=Error';
        }
    }

    // ========== 10. BATCH PROCESSING FUNCTIONS ==========
    function divideQuantityByHours(totalQty, hours, shiftType = 'morning', otMode = '4h') {
        // Làm tròn đến 0.5h
        const roundedHours = Math.round(hours * 2) / 2;
        
        // Tính số slot nguyên (1 slot = 1 giờ) và slot 0.5 giờ
        const fullSlots = Math.floor(roundedHours);
        const hasHalfSlot = (roundedHours - fullSlots) > 0;
        const totalSlots = fullSlots + (hasHalfSlot ? 1 : 0);
        
        if (totalSlots === 0 || totalQty === 0) {
            return {
                distribution: [],
                productionData: {},
                totalHours: 0,
                slotsUsed: 0,
                error: "Không có slot hoặc sản lượng"
            };
        }
        
        // PHƯƠNG PHÁP MỚI: Đảm bảo tổng sản lượng chính xác
        let distribution = [];
        
        if (hasHalfSlot) {
            // Nếu có slot 0.5h: chia thành các slot 1h và 1 slot 0.5h
            const baseQtyPerFullSlot = Math.floor(totalQty / (fullSlots + 0.5));
            const halfSlotQty = Math.floor(baseQtyPerFullSlot / 2);
            let remainingQty = totalQty - (baseQtyPerFullSlot * fullSlots) - halfSlotQty;
            
            // Phân bổ cho các slot đầy đủ
            for (let i = 0; i < fullSlots; i++) {
                let qty = baseQtyPerFullSlot;
                if (remainingQty > 0) {
                    qty++;
                    remainingQty--;
                }
                distribution.push(qty);
            }
            
            // Phân bổ cho slot 0.5h
            let finalHalfQty = halfSlotQty + remainingQty;
            distribution.push(finalHalfQty);
            
        } else {
            // Nếu tất cả slot đều đầy đủ (1h)
            const baseQty = Math.floor(totalQty / totalSlots);
            let remainder = totalQty - (baseQty * totalSlots);
            
            for (let i = 0; i < totalSlots; i++) {
                let qty = baseQty;
                if (remainder > 0) {
                    qty++;
                    remainder--;
                }
                distribution.push(qty);
            }
        }
        
        // Xác định slots sẽ điền
        let slotsToFill = [];
        
        if (shiftType === 'morning') {
            // Ca sáng: slot 1-4, 6-9 (bỏ slot 5 nghỉ trưa)
            const morningSlots = [0, 1, 2, 3, 5, 6, 7, 8];
            const effectiveSlots = Math.min(totalSlots, 8);
            slotsToFill = morningSlots.slice(0, effectiveSlots);
            
        } else if (shiftType === 'ot') {
            if (otMode === '4h') {
                // Chỉ điền 4 slot cuối (OT) - bỏ qua slot dinner
                const otSlots = [8, 9, 10, 11];
                const effectiveSlots = Math.min(totalSlots, 4);
                slotsToFill = otSlots.slice(0, effectiveSlots);
            } else {
                // 11h đều: điền cả sáng và OT, ưu tiên OT trước
                let allSlots = [];
                
                // OT slots trước (9-12, bỏ dinner)
                for (let i = OT_START_INDEX; i < timeSlots.length - 1; i++) {
                    allSlots.push(i);
                }
                
                // Sáng slots sau (1-4, 6-8, bỏ lunch)
                for (let i = 0; i < OT_START_INDEX; i++) {
                    if (i !== LUNCH_SLOT_INDEX) {
                        allSlots.push(i);
                    }
                }
                
                const effectiveSlots = Math.min(totalSlots, allSlots.length);
                slotsToFill = allSlots.slice(0, effectiveSlots);
            }
        }
        
        // Tạo production data object
        const productionData = {};
        distribution.forEach((qty, index) => {
            if (slotsToFill[index] !== undefined) {
                const slotTime = timeSlots[slotsToFill[index]];
                productionData[slotTime] = qty;
            }
        });
        
        // Tính tổng để kiểm tra
        const totalDistributed = distribution.reduce((a, b) => a + b, 0);
        const isExact = totalDistributed === totalQty;
        
        return {
            distribution: distribution,
            productionData: productionData,
            totalHours: roundedHours,
            slotsUsed: slotsToFill.length,
            totalDistributed: totalDistributed,
            isExact: isExact,
            difference: totalQty - totalDistributed
        };
    }

    async function sendFaCommand(apiKey, packageId, opserial) {
        try {
            const url = `${API_URLS.SCANNER}?apikey=${encodeURIComponent(apiKey)}&mxpackage=${encodeURIComponent(packageId)}&mcid=&opserial=${opserial}&processtype=FA`;
            const response = await fetch(url);
            const isSent = response.ok; 
            return { 
                success: isSent, 
                message: isSent ? "Server received command" : "Server Error: " + response.status, 
                simpleMessage: isSent ? "✅ Đã gửi lệnh" : "❌ Lỗi mạng/Server" 
            };
        } catch (error) { 
            return { 
                success: false, 
                message: error.message || "Connection Error", 
                simpleMessage: "❌ Lỗi kết nối" 
            }; 
        }
    }

    async function confirmBatchProcess() {
        closeBatchPreviewModal();
        
        const apiKey = document.getElementById('apiKey').value;
        if (!apiKey) {
            Swal.fire('Lỗi', 'API Key không tồn tại!', 'error');
            return;
        }
        
        // Lấy trạng thái FA
        globalFaEnabled = document.getElementById('globalFaToggle').checked;
        
        // ============================================
        // MỞ MODAL VÀ HIỂN THỊ PROGRESS BAR
        // ============================================
        const modal = document.getElementById('resultModal');
        const content = document.getElementById('resultContent');
        modal.classList.add('open');
        
        const totalCount = batchSelected.size;
        
        // Tạo HTML cho progress bar
        content.innerHTML = `
            <div class="progress-container">
                <div class="progress-info">
                    <span class="progress-text">🚀 Đang xử lý hàng loạt...</span>
                    <span class="progress-percentage" id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-wrapper">
                    <div class="progress-bar-fill" id="progressBar" style="width: 0%">
                        <span id="progressCount">0/${totalCount}</span>
                    </div>
                </div>
                <div class="progress-details">
                    <span>✅ Thành công: <b id="progressSuccess">0</b></span>
                    <span>❌ Thất bại: <b id="progressFail">0</b></span>
                </div>
                <div class="progress-current-item" id="progressCurrentItem">
                    Đang chuẩn bị...
                </div>
            </div>
        `;
        
        // ============================================
        // HÀM CẬP NHẬT PROGRESS
        // ============================================
        function updateProgress(current, success, fail, currentItem) {
            const percent = Math.floor((current / totalCount) * 100);
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            const progressCount = document.getElementById('progressCount');
            const progressSuccess = document.getElementById('progressSuccess');
            const progressFail = document.getElementById('progressFail');
            const progressCurrentItem = document.getElementById('progressCurrentItem');
            
            if (progressBar) progressBar.style.width = percent + '%';
            if (progressPercent) progressPercent.textContent = percent + '%';
            if (progressCount) progressCount.textContent = `${current}/${totalCount}`;
            if (progressSuccess) progressSuccess.textContent = success;
            if (progressFail) progressFail.textContent = fail;
            
            if (currentItem && progressCurrentItem) {
                // Giới hạn độ dài tên để tránh overflow
                const displayName = currentItem.length > 50 
                    ? currentItem.substring(0, 47) + '...' 
                    : currentItem;
                progressCurrentItem.textContent = `🔄 Đang xử lý: ${displayName}`;
            }
        }
        
        // ============================================
        // XỬ LÝ TỪNG GÓI VỚI PROGRESS UPDATE
        // ============================================
        let processedCount = 0;
        let successCount = 0;
        let failCount = 0;
        let faSuccessCount = 0;
        let faFailCount = 0;
        const errors = [];
        
        for (const pkgId of batchSelected) {
            processedCount++;
            
            try {
                const pkg = allPackages.find(p => p.id === pkgId);
                const cfg = batchConfigs[pkgId];
                
                if (!pkg || !cfg) {
                    failCount++;
                    errors.push(`${pkgId}: Không tìm thấy dữ liệu`);
                    updateProgress(processedCount, successCount, failCount, pkgId);
                    continue;
                }
                
                // Cập nhật progress TRƯỚC khi xử lý
                const displayName = `${pkg.style} (${pkg.target}pcs)`;
                updateProgress(processedCount, successCount, failCount, displayName);
                
                // Tính toán phân bổ
                const result = divideQuantityByHours(pkg.target, cfg.hours, cfg.shift, cfg.otMode);
                const productionData = result.productionData;
                
                // Gửi dữ liệu sản lượng
                const payload = {
                    mxpackage: pkgId,
                    opserial: "1",
                    production_data: productionData,
                    action: 'update'
                };
                
                const res = await fetch(API_URLS.PROD, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-API-Key': apiKey
                    },
                    body: JSON.stringify(payload)
                });
                
                const json = await res.json();
                
                if (!res.ok || !json.success) {
                    throw new Error(json.message || `HTTP ${res.status}`);
                }
                
                // Gửi lệnh FA nếu được bật
                let faResult = null;
                if (globalFaEnabled) {
                    faResult = await sendFaCommand(apiKey, pkgId, "1");
                    if (faResult.success) {
                        faSuccessCount++;
                    } else {
                        faFailCount++;
                        errors.push(`${pkgId}: FA failed - ${faResult.message}`);
                    }
                }
                
                successCount++;
                
                // Cập nhật progress SAU khi xử lý thành công
                updateProgress(processedCount, successCount, failCount, displayName);
                
                console.log(`✅ Đã gửi: ${pkgId} - ${pkg.target}pcs - ${cfg.hours}h - FA: ${globalFaEnabled ? (faResult?.success ? '✅' : '❌') : 'N/A'}`);
                
                // Delay nhỏ để người dùng thấy progress (tuỳ chọn)
                await new Promise(resolve => setTimeout(resolve, 100));
                
            } catch (error) {
                console.error(`❌ Lỗi gửi ${pkgId}:`, error);
                failCount++;
                errors.push(`${pkgId}: ${error.message || error}`);
                
                // Cập nhật progress khi có lỗi
                updateProgress(processedCount, successCount, failCount, pkgId);
            }
        }
        
        // ============================================
        // HIỂN THỊ KẾT QUẢ CUỐI CÙNG
        // ============================================
        // Delay 500ms để người dùng thấy 100%
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Hiển thị kết quả
        showResultModal(successCount, failCount, faSuccessCount, faFailCount, errors);
        
        // Reset selections sau 1 giây
        setTimeout(() => {
            batchSelected.clear();
            batchConfigs = {};
            updateSummary();
            renderPackageList(allPackages.filter(p => 
                document.getElementById(`card-${p.id}`)?.style.display !== 'none'
            ));
            
            // Reload statuses
            const apiKey = document.getElementById('apiKey').value;
            if (apiKey) {
                syncStatuses(allPackages.filter(p => 
                    document.getElementById(`card-${p.id}`)?.style.display !== 'none'
                ), apiKey);
            }
        }, 1000);
    }

                        ${faFailCount > 0 ? `
                        <div style="text-align: center; flex: 1;">
                            <div style="font-size: 22px; color: #EF4444; font-weight: bold;">${faFailCount}</div>
                            <div style="font-size: 11px; color: var(--text-light);">FA Thất bại</div>
                        </div>
                        ` : ''}
                        ${faSuccessCount + faFailCount > 0 ? `
                        <div style="text-align: center; flex: 1;">
                            <div style="font-size: 22px; color: #3B82F6; font-weight: bold;">${faRate}%</div>
                            <div style="font-size: 11px; color: var(--text-light);">Tỷ lệ FA</div>
                        </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
        
        // Error details
        if (errors.length > 0) {
            resultHtml += `
                <div class="error-details" style="background: #FEF2F2; padding: 12px; border-radius: 8px; border: 1px solid #FCA5A5;">
                    <h4 style="color: #EF4444; margin-bottom: 10px; font-size: 14px; display: flex; align-items: center; gap: 8px;">
                        <i class="fas fa-exclamation-triangle"></i> Chi tiết lỗi (${errors.length})
                    </h4>
                    <div style="max-height: 150px; overflow-y: auto;">
                        ${errors.map((error, index) => `
                            <div class="error-item" style="font-size:12px; margin-bottom:4px">
                                <strong>${index + 1}.</strong> ${error}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        // Process information
        resultHtml += `
                <div class="process-info" style="margin-top:15px; padding:12px; background:#F3F4F6; border-radius:8px">
                    <h4 style="font-size:14px; margin-bottom:8px"><i class="fas fa-info-circle"></i> Thông tin xử lý</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; font-size: 12px;">
                        <div>
                            <strong>Tổng số gói:</strong> ${totalProcessed}
                        </div>
                        <div>
                            <strong>Tổng sản lượng:</strong> ${totalQty} cái
                        </div>
                        <div>
                            <strong>Tổng giờ làm:</strong> ${totalHours.toFixed(1)}h
                        </div>
                        <div>
                            <strong>Gửi FA:</strong> ${globalFaEnabled ? 'CÓ' : 'KHÔNG'}
                        </div>
                        <div>
                            <strong>Thời gian:</strong> ${new Date().toLocaleString('vi-VN')}
                        </div>
                        <div>
                            <strong>Phiên bản:</strong> Batch Mode Pro V2.5 ✨
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        content.innerHTML = resultHtml;
        modal.classList.add('open');
    }

    function closeResultModal() {
        document.getElementById('resultModal').classList.remove('open');
    }
</script>
</body>
</html>
