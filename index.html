<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Pro - Batch Production Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        /* ========== CSS CHUNG ========== */
        :root {
            --primary: #1976D2;
            --primary-dark: #0D47A1;
            --accent: #FF9800;
            --ot-color: #9C27B0;
            --bg-grad: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background: var(--bg-grad); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 95vh; }
        
        /* ========== HEADER ========== */
        .header { 
            background: white; 
            border-bottom: 1px solid #eee;
            padding: 15px 25px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 22px; color: var(--primary-dark); display: flex; align-items: center; gap: 10px; }
        .header-badge { 
            background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%); 
            color: white; padding: 5px 15px; border-radius: 20px; 
            font-size: 12px; font-weight: bold; 
        }

        /* ========== TOOLBAR & CONFIG ========== */
        .toolbar { padding: 15px 25px; background: #f8f9fa; border-bottom: 1px solid #ddd; display: flex; gap: 15px; flex-wrap: wrap; align-items: end; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #555; }
        .form-control { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: border 0.3s; }
        .form-control:focus { border-color: var(--primary); }
        
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-success { background: #4CAF50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        
        /* ========== MAIN CONTENT AREA ========== */
        .content-wrapper { display: flex; flex: 1; overflow: hidden; }
        
        /* LEFT SIDE: PACKAGE LIST */
        .package-list-area { flex: 1; padding: 20px; overflow-y: auto; background: #fff; }
        
        /* SEARCH BAR */
        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-input-wrapper { position: relative; flex: 1; }
        .search-input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #999; }
        .search-input { width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #ddd; border-radius: 6px; }

        /* PACKAGE CARD - PRO LAYOUT */
        .line-header { 
            background: #e3f2fd; color: #1565c0; padding: 8px 15px; 
            font-weight: 700; border-radius: 4px; margin: 15px 0 10px 0; font-size: 14px; 
        }

        .package-card {
            display: grid;
            grid-template-columns: 80px 1fr 100px 220px; /* Ảnh - Info - Status - Command Center */
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: all 0.2s;
            overflow: hidden;
            min-height: 90px;
        }
        
        .package-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.08); border-color: #bbb; }
        .package-card.selected { border: 2px solid var(--primary); background: #f0f7ff; }

        /* Cột 1: Ảnh & Checkbox */
        .col-img { position: relative; background: #f5f5f5; display: flex; align-items: center; justify-content: center; border-right: 1px solid #eee; }
        .pkg-img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.2s; }
        .package-card.selected .pkg-img { opacity: 1; }
        .checkbox-wrapper { position: absolute; top: 5px; left: 5px; z-index: 2; }
        .pkg-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

        /* Cột 2: Info */
        .col-info { padding: 10px 15px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .pkg-id { font-size: 12px; font-weight: 700; color: var(--primary); font-family: monospace; }
        .pkg-style { font-size: 15px; font-weight: 600; color: #333; line-height: 1.2; }
        .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
        .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #eee; color: #555; font-weight: 500; }

        /* Cột 3: Status */
        .col-status { display: flex; flex-direction: column; align-items: center; justify-content: center; border-left: 1px dashed #eee; padding: 10px; }
        .qty-badge { font-size: 20px; font-weight: 800; color: #333; }
        .status-label { font-size: 10px; color: #777; text-transform: uppercase; font-weight: 600; }
        
        /* Cột 4: COMMAND CENTER (Trái tim của Layout mới) */
        .col-cmd { 
            padding: 10px; 
            background: #fafafa; 
            border-left: 1px solid #e0e0e0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            gap: 8px;
            transition: background 0.3s;
        }
        
        /* OT MODE STYLING */
        .col-cmd.mode-ot { background: #f3e5f5; border-left-color: var(--ot-color); }

        /* Segment Control (Tab Chuyển đổi) */
        .segment-control { display: flex; background: #e0e0e0; border-radius: 6px; padding: 2px; width: 100%; }
        .segment-btn { 
            flex: 1; border: none; background: transparent; padding: 6px 0; 
            font-size: 12px; font-weight: 600; color: #666; cursor: pointer; border-radius: 4px; 
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .segment-btn:hover { background: rgba(255,255,255,0.5); }
        .segment-btn.active { background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .segment-btn.active.hc { color: #e65100; font-weight: 800; } /* Cam cho Hành Chính */
        .segment-btn.active.ot { color: var(--ot-color); font-weight: 800; } /* Tím cho OT */

        /* Input Group */
        .input-row { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .input-label { font-size: 11px; font-weight: 600; color: #555; }
        .hour-input { 
            width: 60px; padding: 4px; text-align: center; border: 1px solid #ccc; 
            border-radius: 4px; font-weight: bold; font-size: 14px; color: #333;
        }
        .hour-input:focus { border-color: var(--primary); outline: none; }

        /* Quick Options (Sub buttons) */
        .quick-options { display: flex; gap: 5px; width: 100%; }
        .btn-tiny { 
            flex: 1; font-size: 10px; padding: 4px 0; border: 1px solid var(--ot-color); 
            color: var(--ot-color); background: white; border-radius: 4px; cursor: pointer; 
            font-weight: 600; transition: all 0.2s;
        }
        .btn-tiny:hover { background: #f3e5f5; }
        .btn-tiny.active { background: var(--ot-color); color: white; }

        /* Disabled State */
        .disabled-overlay { opacity: 0.5; pointer-events: none; filter: grayscale(1); }

        /* RIGHT SIDE: SUMMARY & ACTION */
        .summary-area { 
            width: 320px; background: white; border-left: 1px solid #ddd; 
            display: flex; flex-direction: column; padding: 20px; z-index: 10;
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
        }
        .summary-card { 
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); 
            border-radius: 12px; padding: 20px; color: #0d47a1; margin-bottom: 20px;
        }
        .summary-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .summary-total { font-size: 24px; font-weight: 800; margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(0,0,0,0.1); }
        
        .action-btn { 
            width: 100%; padding: 15px; border: none; border-radius: 8px; 
            background: linear-gradient(90deg, #1976D2 0%, #2196F3 100%); color: white; 
            font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
            transition: transform 0.2s;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(33, 150, 243, 0.4); }
        .action-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* LOADER & UTILS */
        .loader { width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        
        /* RESPONSIVE */
        @media (max-width: 992px) {
            .package-card { grid-template-columns: 70px 1fr; grid-template-rows: auto auto auto; min-height: auto; }
            .col-img { grid-row: 1 / 3; }
            .col-info { grid-column: 2; }
            .col-status { grid-row: 2; grid-column: 2; border-left: none; border-top: 1px dashed #eee; flex-direction: row; gap: 10px; justify-content: flex-start; }
            .col-cmd { grid-column: 1 / 3; border-left: none; border-top: 1px solid #eee; flex-direction: row; align-items: center; justify-content: space-between; }
            .segment-control { width: 140px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <h1><i class="fas fa-cubes"></i> MES Production <span style="font-size:14px; color:#777; font-weight:400; margin-left:10px">Batch Mode Pro</span></h1>
        <div class="header-badge"><i class="fas fa-bolt"></i> V2.0 FINAL</div>
    </div>

    <!-- CONFIG TOOLBAR -->
    <div class="toolbar">
        <div class="form-group" style="flex: 2;">
            <label>API Key</label>
            <input type="password" id="apiKey" class="form-control" placeholder="Nhập khóa API...">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Factory</label>
            <select id="factory" class="form-control">
                <option value="P2C1">P2C1</option>
                <option value="P2A1">P2A1</option>
                <option value="P2B1">P2B1</option>
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Date</label>
            <input type="date" id="dateSelect" class="form-control">
        </div>
        <button class="btn btn-primary" onclick="loadPackages()">
            <i class="fas fa-sync-alt"></i> Tải dữ liệu
        </button>
    </div>

    <div class="content-wrapper">
        <!-- LEFT: LIST -->
        <div class="package-list-area">
            <!-- Filter & Search -->
            <div class="search-bar">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm Style, Line, ID..." oninput="filterPackages()">
                </div>
                <select id="lineFilter" class="form-control" style="width: 150px;" onchange="filterPackages()">
                    <option value="all">Tất cả Line</option>
                </select>
                <button class="btn btn-success" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none">
                    <i class="fas fa-check-double"></i> Chọn tất cả
                </button>
            </div>

            <!-- List Container -->
            <div id="packageListContainer">
                <div style="text-align:center; padding:50px; color:#999;">
                    <i class="fas fa-cloud-download-alt fa-3x" style="margin-bottom:15px; opacity:0.3"></i><br>
                    Vui lòng nhập API Key và tải dữ liệu
                </div>
            </div>
        </div>

        <!-- RIGHT: SUMMARY -->
        <div class="summary-area">
            <h3><i class="fas fa-chart-pie"></i> Tổng quan Batch</h3>
            <div style="font-size:12px; color:#666; margin-bottom:15px">Các gói được chọn để gửi đi</div>
            
            <div class="summary-card">
                <div class="summary-item">
                    <span>Số gói đã chọn:</span>
                    <strong id="sumCount">0</strong>
                </div>
                <div class="summary-item">
                    <span>Tổng Target:</span>
                    <strong id="sumQty">0</strong>
                </div>
                <div class="summary-item">
                    <span>Tổng giờ công:</span>
                    <strong id="sumHours">0h</strong>
                </div>
                <div class="summary-total">
                    <div style="font-size:12px; font-weight:600; color:#555">Dự kiến gửi:</div>
                    <span id="sumTotal">0 pcs</span>
                </div>
            </div>

            <div style="flex:1"></div> <!-- Spacer -->
            
            <button id="processBtn" class="action-btn" onclick="processBatch()" disabled>
                <i class="fas fa-paper-plane"></i> GỬI SẢN LƯỢNG
            </button>
        </div>
    </div>
</div>

<script>
    // ========== 1. CẤU HÌNH & BIẾN TOÀN CỤC ==========
    const API_URLS = {
        PACKAGE: "https://today-package.chiscoong-cloudflare-com.workers.dev/api/packages",
        PROD: "https://hourly-target.chiscoong-cloudflare-com.workers.dev/api/production",
        IMG_PROXY: "https://mes-proxy.vercel.app/api"
    };

    let allPackages = [];
    let batchSelected = new Set(); // Lưu ID các gói được chọn
    let batchConfigs = {}; // Lưu cấu hình từng gói: { id: { shift: 'morning'|'ot', otMode: '4h'|'11h', hours: 7.5 } }
    
    // Slot thời gian chuẩn
    const timeSlots = [
        "07:15 - 08:15", "08:15 - 09:15", "09:15 - 10:15", "10:15 - 11:15", 
        "11:15 - 12:15", "12:15 - 13:15", "13:15 - 14:15", "14:15 - 15:15", 
        "15:15 - 16:15", "16:15 - 17:15", "17:15 - 18:15", "18:15 - 19:15", "19:15 - 20:15"
    ];

    // Khởi tạo
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('dateSelect').value = new Date().toISOString().split('T')[0];
        const savedKey = localStorage.getItem('mesApiKey');
        if (savedKey) document.getElementById('apiKey').value = savedKey;
    });

    // ========== 2. HÀM TẢI DỮ LIỆU ==========
    async function loadPackages() {
        const apiKey = document.getElementById('apiKey').value;
        const factory = document.getElementById('factory').value;
        const dateStr = document.getElementById('dateSelect').value.replace(/-/g, '');
        
        if (!apiKey) return Swal.fire('Thiếu API Key', 'Vui lòng nhập API Key!', 'warning');
        localStorage.setItem('mesApiKey', apiKey);

        const container = document.getElementById('packageListContainer');
        container.innerHTML = '<div style="text-align:center; padding:40px;"><div class="loader" style="margin:0 auto 10px"></div>Đang tải dữ liệu...</div>';

        try {
            const res = await fetch(`${API_URLS.PACKAGE}?factory=${factory}&fromDate=${dateStr}&apikey=${apiKey}`);
            const json = await res.json();
            const rawList = json.data?.packages || json.data || [];

            allPackages = rawList.map(p => ({
                id: p.packageId || p.MXPACKAGE,
                style: p.styleText || "N/A",
                line: p.lineName || "N/A",
                target: parseInt(p.target || p.MXTARGET || 0),
                color: p.color || "",
                fileName: p.FileName || null,
                searchStr: `${p.packageId} ${p.styleText} ${p.lineName}`.toLowerCase()
            }));

            // Reset state
            batchSelected.clear();
            batchConfigs = {};
            populateLineFilter();
            renderList(allPackages);
            document.getElementById('selectAllBtn').style.display = 'inline-flex';

        } catch (e) {
            container.innerHTML = `<div style="text-align:center; color:red">Lỗi: ${e.message}</div>`;
        }
    }

    // ========== 3. RENDER GIAO DIỆN (CARD PRO) ==========
    function renderList(list) {
        const container = document.getElementById('packageListContainer');
        container.innerHTML = '';

        if (list.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:20px; color:#999">Không tìm thấy gói nào</div>';
            return;
        }

        // Sort theo Line
        list.sort((a, b) => a.line.localeCompare(b.line, undefined, {numeric: true}));

        let curLine = null;
        list.forEach(p => {
            // Header Line
            if (p.line !== curLine) {
                curLine = p.line;
                container.insertAdjacentHTML('beforeend', `<div class="line-header">LINE ${curLine}</div>`);
            }

            // Get Config State (nếu có) hoặc Default
            const config = batchConfigs[p.id] || { shift: 'morning', otMode: '4h', hours: 7.5 };
            const isSel = batchSelected.has(p.id);
            const thumbUrl = getThumbUrl(p.id, p.fileName);

            const html = `
                <div class="package-card ${isSel ? 'selected' : ''}" id="card-${p.id}" data-id="${p.id}">
                    <!-- COL 1: IMG & CHECK -->
                    <div class="col-img">
                        <div class="checkbox-wrapper">
                            <input type="checkbox" class="pkg-checkbox" onchange="togglePkg('${p.id}')" ${isSel ? 'checked' : ''}>
                        </div>
                        <img src="${thumbUrl}" class="pkg-img" onerror="this.src='https://placehold.co/100?text=No+Img'">
                    </div>

                    <!-- COL 2: INFO -->
                    <div class="col-info">
                        <div class="pkg-id">${p.id}</div>
                        <div class="pkg-style">${p.style}</div>
                        <div class="tags">
                            <span class="tag"><i class="fas fa-palette"></i> ${p.color || 'Màu mặc định'}</span>
                        </div>
                    </div>

                    <!-- COL 3: STATUS -->
                    <div class="col-status">
                        <span class="qty-badge">${p.target}</span>
                        <span class="status-label">Target</span>
                    </div>

                    <!-- COL 4: COMMAND CENTER (PRO) -->
                    <div class="col-cmd ${config.shift === 'ot' ? 'mode-ot' : ''} ${isSel ? '' : 'disabled-overlay'}" id="cmd-${p.id}">
                        
                        <!-- TAB CHUYỂN ĐỔI -->
                        <div class="segment-control">
                            <button class="segment-btn hc ${config.shift === 'morning' ? 'active' : ''}" 
                                onclick="setShift('${p.id}', 'morning')">
                                <i class="fas fa-sun"></i> Hành Chính
                            </button>
                            <button class="segment-btn ot ${config.shift === 'ot' ? 'active' : ''}" 
                                onclick="setShift('${p.id}', 'ot')">
                                <i class="fas fa-moon"></i> Tăng Ca
                            </button>
                        </div>

                        <!-- INPUT GIỜ -->
                        <div class="input-row">
                            <span class="input-label">Giờ làm:</span>
                            <input type="number" class="hour-input" id="input-${p.id}"
                                value="${config.hours}" step="0.5" min="0.5" max="14"
                                onchange="updateHours('${p.id}', this.value)">
                        </div>

                        <!-- SUB OPTIONS (OT ONLY) -->
                        <div class="quick-options ${config.shift === 'morning' ? 'hidden' : ''}" id="ot-opts-${p.id}">
                            <button class="btn-tiny ${config.otMode === '4h' ? 'active' : ''}" 
                                onclick="setOtMode('${p.id}', '4h')">4h Cuối</button>
                            <button class="btn-tiny ${config.otMode === '11h' ? 'active' : ''}" 
                                onclick="setOtMode('${p.id}', '11h')">11h Đều</button>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
        });
        updateSummary();
    }

    // ========== 4. LOGIC TƯƠNG TÁC (CỐT LÕI) ==========

    // 4.1 Checkbox Toggle
    function togglePkg(id) {
        const card = document.getElementById(`card-${id}`);
        const cmd = document.getElementById(`cmd-${id}`);
        
        if (batchSelected.has(id)) {
            // Uncheck
            batchSelected.delete(id);
            card.classList.remove('selected');
            cmd.classList.add('disabled-overlay');
        } else {
            // Check
            batchSelected.add(id);
            card.classList.add('selected');
            cmd.classList.remove('disabled-overlay');
            
            // Khởi tạo config mặc định nếu chưa có
            if (!batchConfigs[id]) {
                batchConfigs[id] = { shift: 'morning', otMode: '4h', hours: 7.5 };
                refreshCardUI(id);
            }
        }
        updateSummary();
    }

    // 4.2 Chuyển Ca (Auto-fill Logic)
    function setShift(id, type) {
        if (!batchSelected.has(id)) togglePkg(id); // Auto select if clicking buttons

        // Cập nhật state
        if (!batchConfigs[id]) batchConfigs[id] = {};
        batchConfigs[id].shift = type;

        // Auto-fill giờ
        if (type === 'morning') {
            batchConfigs[id].hours = 7.5;
        } else {
            // Nếu chuyển sang OT, mặc định 4h nếu chưa có mode
            if (!batchConfigs[id].otMode) batchConfigs[id].otMode = '4h';
            batchConfigs[id].hours = (batchConfigs[id].otMode === '4h') ? 4 : 11;
        }

        refreshCardUI(id);
        updateSummary();
    }

    // 4.3 Chuyển Mode OT (Auto-fill Logic)
    function setOtMode(id, mode) {
        if (!batchSelected.has(id)) return;

        batchConfigs[id].otMode = mode;
        batchConfigs[id].hours = (mode === '4h') ? 4 : 11;

        refreshCardUI(id);
        updateSummary();
    }

    // 4.4 Nhập tay giờ
    function updateHours(id, val) {
        if (!batchSelected.has(id)) return;
        let num = parseFloat(val);
        if (num < 0.5) num = 0.5;
        if (num > 14) num = 14; // Max giới hạn
        
        batchConfigs[id].hours = num;
        refreshCardUI(id); // Để format lại số hiển thị nếu cần
        updateSummary();
    }

    // 4.5 Cập nhật UI Card cụ thể (Tránh render lại cả list)
    function refreshCardUI(id) {
        const cfg = batchConfigs[id];
        const cmd = document.getElementById(`cmd-${id}`);
        const input = document.getElementById(`input-${id}`);
        const otOpts = document.getElementById(`ot-opts-${id}`);
        
        // Background
        if (cfg.shift === 'ot') cmd.classList.add('mode-ot');
        else cmd.classList.remove('mode-ot');

        // Segment Buttons
        cmd.querySelector('.segment-btn.hc').classList.toggle('active', cfg.shift === 'morning');
        cmd.querySelector('.segment-btn.ot').classList.toggle('active', cfg.shift === 'ot');

        // Input Value
        input.value = cfg.hours;

        // OT Options
        if (cfg.shift === 'ot') {
            otOpts.classList.remove('hidden');
            otOpts.querySelector('button:nth-child(1)').classList.toggle('active', cfg.otMode === '4h');
            otOpts.querySelector('button:nth-child(2)').classList.toggle('active', cfg.otMode === '11h');
        } else {
            otOpts.classList.add('hidden');
        }
    }

    // ========== 5. LOGIC TOÁN HỌC (QUAN TRỌNG NHẤT) ==========
    
    // Hàm chia kẹo (Đảm bảo Tổng = Target)
    function calculateDistribution(targetQty, hours, shift, otMode) {
        // 1. Xác định các Slot được phép điền
        // Mảng index (0-based) tương ứng với timeSlots
        // 0:7-8, ..., 4:11-12(Nghỉ), ..., 8:15-16, 9:16-17(OT start)
        
        let allowedIndices = [];
        
        if (shift === 'morning') {
            // Hành chính: Sáng (0-3) + Chiều (5-8). Bỏ slot 4 (trưa)
            allowedIndices = [0, 1, 2, 3, 5, 6, 7, 8];
        } else { // OT
            if (otMode === '4h') {
                // Chỉ OT: Slot 9, 10, 11, 12
                allowedIndices = [9, 10, 11, 12];
            } else { // 11h
                // Full + OT: Tất cả trừ slot 4 (trưa)
                allowedIndices = [0, 1, 2, 3, 5, 6, 7, 8, 9, 10, 11, 12];
            }
        }

        // 2. Lấy N slot đầu tiên dựa trên số giờ
        // Ví dụ 7.5h -> Cần 8 slot để phủ (slot cuối có thể ít, nhưng ở đây chia đều cho đơn giản)
        const slotsNeeded = Math.ceil(hours);
        const activeSlots = allowedIndices.slice(0, slotsNeeded);

        // 3. Chia đều
        const productionData = {};
        
        if (activeSlots.length > 0 && targetQty > 0) {
            const base = Math.floor(targetQty / activeSlots.length);
            let remainder = targetQty % activeSlots.length;

            activeSlots.forEach(idx => {
                let qty = base;
                if (remainder > 0) {
                    qty += 1;
                    remainder--;
                }
                // Map vào tên giờ
                const timeLabel = timeSlots[idx];
                if (timeLabel) productionData[timeLabel] = qty;
            });
        }
        
        return productionData;
    }

    // ========== 6. XỬ LÝ GỬI & TIỆN ÍCH ==========

    function updateSummary() {
        const count = batchSelected.size;
        let totalQty = 0;
        let totalHours = 0;

        batchSelected.forEach(id => {
            const p = allPackages.find(x => x.id === id);
            const cfg = batchConfigs[id];
            if (p && cfg) {
                totalQty += p.target;
                totalHours += cfg.hours;
            }
        });

        document.getElementById('sumCount').innerText = count;
        document.getElementById('sumQty').innerText = totalQty.toLocaleString();
        document.getElementById('sumHours').innerText = totalHours.toFixed(1) + 'h';
        document.getElementById('sumTotal').innerText = totalQty.toLocaleString() + ' pcs';
        
        document.getElementById('processBtn').disabled = (count === 0);
    }

    async function processBatch() {
        if (batchSelected.size === 0) return;

        // Confirm
        const confirm = await Swal.fire({
            title: 'Xác nhận gửi?',
            text: `Bạn sắp gửi sản lượng cho ${batchSelected.size} gói.`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Gửi ngay',
            cancelButtonText: 'Hủy'
        });

        if (!confirm.isConfirmed) return;

        // Show Loading
        Swal.fire({
            title: 'Đang xử lý...',
            html: 'Đang tính toán và gửi dữ liệu.',
            allowOutsideClick: false,
            didOpen: () => Swal.showLoading()
        });

        const apiKey = document.getElementById('apiKey').value;
        let success = 0, fail = 0;

        // Process Loop
        for (const id of batchSelected) {
            try {
                const p = allPackages.find(x => x.id === id);
                const cfg = batchConfigs[id];
                
                // Tính toán phân bổ
                const prodData = calculateDistribution(p.target, cfg.hours, cfg.shift, cfg.otMode);

                // Gửi API
                const payload = {
                    mxpackage: id,
                    opserial: "BATCH_MODE",
                    production_data: prodData,
                    action: 'update'
                };

                const res = await fetch(API_URLS.PROD, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-API-Key': apiKey },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) success++; else fail++;

            } catch (e) {
                console.error(e);
                fail++;
            }
        }

        Swal.fire({
            title: 'Hoàn tất!',
            html: `Thành công: <b>${success}</b><br>Thất bại: <b>${fail}</b>`,
            icon: fail === 0 ? 'success' : 'warning'
        });
        
        // Clear selection after success
        if (fail === 0) {
            batchSelected.clear();
            batchConfigs = {};
            renderList(allPackages); // Re-render to clear checks
        }
    }

    // Utils
    function getThumbUrl(pkgId, fileName) {
        if (!fileName) return '';
        const parts = pkgId.split('_');
        if (parts.length < 4) return '';
        const styleFolder = parts[3].substring(0, 7).toUpperCase();
        const buyer = parts[3].substring(0, 3).toUpperCase();
        const fullUrl = `${API_URLS.IMG_PROXY}/PKPDM/style/${buyer}/${styleFolder}/Images/${fileName}`;
        return `https://wsrv.nl/?url=${encodeURIComponent(fullUrl)}&w=150&output=webp`;
    }

    function toggleSelectAll() {
        const visiblePkgs = getFilteredPackages();
        const allSelected = visiblePkgs.every(p => batchSelected.has(p.id));
        
        visiblePkgs.forEach(p => {
            if (allSelected) {
                if(batchSelected.has(p.id)) togglePkg(p.id); // Uncheck
            } else {
                if(!batchSelected.has(p.id)) togglePkg(p.id); // Check
            }
        });
    }

    function filterPackages() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const lineVal = document.getElementById('lineFilter').value;
        
        const filtered = allPackages.filter(p => {
            const matchText = p.searchStr.includes(term);
            const matchLine = lineVal === 'all' || p.line === lineVal;
            return matchText && matchLine;
        });
        renderList(filtered);
    }
    
    function getFilteredPackages() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        const lineVal = document.getElementById('lineFilter').value;
        return allPackages.filter(p => p.searchStr.includes(term) && (lineVal === 'all' || p.line === lineVal));
    }

    function populateLineFilter() {
        const lines = [...new Set(allPackages.map(p => p.line))].sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
        const sel = document.getElementById('lineFilter');
        sel.innerHTML = '<option value="all">Tất cả Line</option>';
        lines.forEach(l => sel.insertAdjacentHTML('beforeend', `<option value="${l}">Line ${l}</option>`));
    }
</script>
