<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shipping Schedule Dashboard</title>
  <meta name="description" content="MES Shipping Schedule Management Dashboard - Quản lý lịch xuất hàng" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: Inter, sans-serif; margin: 0; transition: background .3s, color .3s; }

    /* ── Light theme (default) ── */
    :root {
      --bg-body: #f1f5f9;
      --bg-card: #ffffff;
      --bg-card-alt: #f8fafc;
      --bg-header: #ffffff;
      --bg-input: #ffffff;
      --bg-table-head: #0f172a;
      --bg-table-head-text: #cbd5e1;
      --bg-hover-row: #f1f5f9;
      --border: #e2e8f0;
      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --text-on-dark: #ffffff;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --scrollbar-track: #e5e7eb;
      --scrollbar-thumb: #94a3b8;
      --column-menu-bg: #ffffff;
      --column-menu-shadow: rgba(15,23,42,.18);
      --gate-gradient-from: #0f172a;
      --gate-gradient-to: #1e3a5f;
    }

    /* ── Dark theme ── */
    html.dark {
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --bg-card-alt: #1a2332;
      --bg-header: #1e293b;
      --bg-input: #0f172a;
      --bg-table-head: #020617;
      --bg-table-head-text: #94a3b8;
      --bg-hover-row: #334155;
      --border: #334155;
      --border-input: #475569;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --text-on-dark: #f8fafc;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --scrollbar-track: #1e293b;
      --scrollbar-thumb: #475569;
      --column-menu-bg: #1e293b;
      --column-menu-shadow: rgba(0,0,0,.5);
      --gate-gradient-from: #020617;
      --gate-gradient-to: #0f172a;
    }

    body { background: var(--bg-body); color: var(--text-primary); }

    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 999px; }

    .input, .filter-input {
      width: 100%; border-radius: .5rem; border: 1px solid var(--border-input);
      background: var(--bg-input); padding: .575rem .75rem; font-size: .8125rem;
      color: var(--text-primary); outline: 0; transition: .2s;
    }
    .input:focus, .filter-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
      border-radius: .5rem; padding: .575rem .875rem; font-size: .8125rem;
      font-weight: 700; white-space: nowrap; transition: .2s; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { cursor: not-allowed; opacity: .5; }
    .btn-secondary { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-card-alt); border-color: var(--text-muted); }
    .btn-danger { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
    .btn-danger:hover { background: #ffe4e6; }
    html.dark .btn-danger { background: #4c1d2c; color: #fca5a5; border-color: #7f1d1d; }

    .column-menu {
      position: absolute; right: .25rem; top: 2.4rem; z-index: 30; width: 15rem;
      border: 1px solid var(--border); background: var(--column-menu-bg); color: var(--text-primary);
      border-radius: .75rem; box-shadow: 0 18px 40px var(--column-menu-shadow);
      padding: .75rem; text-transform: none; letter-spacing: 0;
    }
    .column-menu button {
      width: 100%; display: flex; align-items: center; gap: .5rem; border-radius: .5rem;
      padding: .5rem .625rem; font-size: .75rem; font-weight: 700; color: var(--text-secondary);
      background: none; border: none; cursor: pointer;
    }
    .column-menu button:hover { background: var(--bg-card-alt); }
    .column-menu input, .column-menu select {
      width: 100%; border: 1px solid var(--border-input); border-radius: .5rem;
      padding: .5rem .625rem; font-size: .75rem; color: var(--text-primary);
      background: var(--bg-input); outline: 0;
    }

    /* Resizable columns */
    .resizer {
      position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize;
      background: transparent; user-select: none; z-index: 5;
    }
    .resizer:hover, .resizer.active { background: var(--accent); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
      z-index: 100; display: flex; align-items: center; justify-content: center;
      animation: fadeIn .2s ease;
    }
    .modal-content {
      background: var(--bg-card); border-radius: 1rem; box-shadow: 0 32px 64px rgba(0,0,0,.35);
      max-width: 90vw; max-height: 90vh; overflow: hidden; animation: scaleIn .25s ease;
      border: 1px solid var(--border);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

    /* Gate page */
    .gate-bg {
      background: linear-gradient(135deg, var(--gate-gradient-from), var(--gate-gradient-to));
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .gate-card {
      background: rgba(255,255,255,.06); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.1);
      border-radius: 1.25rem; padding: 2.5rem; width: 100%; max-width: 440px;
      box-shadow: 0 32px 64px rgba(0,0,0,.4);
    }

    /* Stat cards gradient */
    .stat-gradient-plan { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
    .stat-gradient-shipped { background: linear-gradient(135deg, #059669 0%, #34d399 100%); }
    .stat-gradient-remain { background: linear-gradient(135deg, #dc2626 0%, #f87171 100%); }
    .stat-gradient-rate { background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%); }
    .stat-gradient-total { background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%); }

    /* Style name link */
    .style-link {
      color: var(--accent); text-decoration: none; cursor: pointer; transition: .15s;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .style-link:hover { color: var(--accent-hover); text-decoration: underline; }

    /* Summary banner */
    .summary-banner {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-radius: .75rem; padding: 1rem 1.25rem; color: #fff;
      display: flex; flex-direction: column; align-items: stretch; gap: .75rem;
    }
    html.dark .summary-banner { background: linear-gradient(135deg, #020617 0%, #1e293b 100%); }
    .summary-row {
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
    }
    .summary-badge {
      display: inline-flex; align-items: center; gap: .375rem;
      padding: .375rem .75rem; border-radius: 2rem; font-size: .75rem; font-weight: 700;
    }

    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      header, .no-print { display: none !important; }
      main { max-width: none !important; padding: 0 !important; margin: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif;">
      <div style="text-align:center;">
        <div style="width:48px;height:48px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
        <p style="color:#64748b;font-size:14px;">Đang tải ứng dụng...</p>
      </div>
    </div>
  </div>

  <script>
    window.onerror = function(msg) {
      var root = document.getElementById('root');
      if (root) root.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif;"><div style="text-align:center;max-width:500px;padding:24px;"><h2 style="color:#be123c;font-size:18px;font-weight:700;margin-bottom:12px;">⚠️ Lỗi tải ứng dụng</h2><p style="color:#64748b;font-size:14px;margin-bottom:8px;">Không thể khởi tạo giao diện. Vui lòng kiểm tra kết nối internet.</p><p style="color:#94a3b8;font-size:12px;background:#f8fafc;padding:8px 12px;border-radius:8px;border:1px solid #e2e8f0;word-break:break-all;">' + msg + '</p><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;">Tải lại trang</button></div></div>';
    };
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <script type="text/babel">
    const { useEffect, useMemo, useRef, useState, useCallback } = React;

    const toPascalCase = str => str.split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');

    const safeStorage = {
      local: {
        getItem(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
        setItem(key, val) { try { localStorage.setItem(key, val); } catch (e) {} },
        removeItem(key) { try { localStorage.removeItem(key); } catch (e) {} }
      },
      session: {
        getItem(key) { try { return sessionStorage.getItem(key); } catch (e) { return null; } },
        setItem(key, val) { try { sessionStorage.setItem(key, val); } catch (e) {} }
      }
    };

    function Icon({ 'data-lucide': name, className, style, ...props }) {
      const iconName = toPascalCase(name || '');
      const lucideIcon = window.lucide?.icons?.[iconName] || window.lucide?.[iconName];

      if (!lucideIcon || !Array.isArray(lucideIcon)) {
        return <span className={className} style={{ display: 'inline-flex', width: '1em', height: '1em', ...style }} {...props} />;
      }

      const styleString = style
        ? Object.entries(style).map(([k,v]) => `${k.replace(/[A-Z]/g, m => `-${m.toLowerCase()}`)}:${v}`).join(';')
        : '';

      const strokeWidth = style?.strokeWidth || 2;
      const width = style?.width || '100%';
      const height = style?.height || '100%';

      const cleanStyleString = styleString
        .split(';')
        .filter(s => {
          const trimmed = s.trim();
          return trimmed && !trimmed.startsWith('width') && !trimmed.startsWith('height') && !trimmed.startsWith('stroke-width');
        })
        .join(';');

      const svgAttrs = {
        xmlns: "http://www.w3.org/2000/svg",
        width: width,
        height: height,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: style?.color || "currentColor",
        "stroke-width": strokeWidth,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
        class: `lucide lucide-${name} ${className || ''}`.trim(),
        style: cleanStyleString
      };

      const attrsString = Object.entries(svgAttrs)
        .map(([k, v]) => `${k}="${v}"`)
        .join(' ');

      const childrenHtml = lucideIcon.map(([tag, attrs]) => {
        const childAttrs = Object.entries(attrs)
          .map(([k, v]) => `${k}="${v}"`)
          .join(' ');
        return `<${tag} ${childAttrs}></${tag}>`;
      }).join('');

      const svgString = `<svg ${attrsString}>${childrenHtml}</svg>`;

      return (
        <span
          className="inline-flex items-center justify-center"
          style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
          dangerouslySetInnerHTML={{ __html: svgString }}
          {...props}
        />
      );
    }

    // Monkey-patch React.createElement to automatically replace <i> tags with <Icon>
    const originalCreateElement = React.createElement;
    React.createElement = function(type, props, ...children) {
      if (type === 'i' && props && props['data-lucide']) {
        return originalCreateElement(Icon, props, ...children);
      }
      return originalCreateElement(type, props, ...children);
    };

    const BACKEND_URL = "https://shipping-schedule-management.chiscoong-cloudflare-com.workers.dev/";
    const MAX_CALLS_PER_MIN = 6;
    const FACTORIES = ['P2A1', 'P2B1', 'P2C1', 'P2D1', 'P2E1'];

    /* ── Utility helpers ── */
    const toText = v => String(v ?? '').trim();
    const upper = v => toText(v).toUpperCase();
    const includesText = (value, query) => !toText(query) || upper(value).includes(upper(query));
    const normalizeAo = v => upper(v).replace(/^AD-/, '').trim();
    const formatNumber = v => Number(v ?? 0).toLocaleString('vi-VN');

    const downloadBlob = (content, filename, type) => {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url; link.download = filename;
      document.body.appendChild(link); link.click(); link.remove();
      URL.revokeObjectURL(url);
    };

    const toYyyymmdd = date => {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}${m}${d}`;
    };
    const today = new Date();
    const TODAY_STR = toYyyymmdd(today);
    const oneWeekLater = new Date(today); oneWeekLater.setDate(oneWeekLater.getDate() + 7);
    const ONE_WEEK_STR = toYyyymmdd(oneWeekLater);

    const fmtDateInput = d => d ? `${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}` : '';
    const parseDateInput = v => v.replace(/-/g, '');
    const fmtDisplayDate = v => {
      const clean = toText(v).replace(/-/g, '');
      if (clean.length < 8) return toText(v) || '-';
      return `${clean.slice(6,8)}/${clean.slice(4,6)}/${clean.slice(0,4)}`;
    };

    async function fetchApi(params) {
      const token = safeStorage.local.getItem('ss_token');
      const qs = Object.entries(params).filter(([,v]) => toText(v)).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
      const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
      const res = await fetch(`${BACKEND_URL}?${qs}`, { headers });
      if (res.status === 401) {
        safeStorage.local.removeItem('ss_token');
        safeStorage.local.removeItem('ss_user');
        throw new Error('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.');
      }
      const payload = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(payload.error || payload.message || `HTTP ${res.status}`);
      return payload;
    }

    async function fetchBuyerList() {
      return fetchApi({ action: 'buyers' });
    }

    async function fetchPackageDbData() {
      return fetchApi({ action: 'pkgdb' });
    }

    function buildPackageLookup(packageData) {
      const map = new Map();
      (packageData?.data || []).forEach(style => {
        (style.skus || []).forEach(sku => {
          const skuKey = upper(sku.sku_full);
          (sku.ao_details || []).forEach(ao => {
            const key = `${skuKey}|${normalizeAo(ao.ao_no)}`;
            map.set(key, {
              qty: Number(ao.qty || 0),
              packages_count: Number(ao.packages_count || 0)
            });
          });
        });
      });
      return map;
    }

    function packageRowKey(sku, aoNo) {
      return `${upper(sku)}|${normalizeAo(aoNo)}`;
    }

    /* ══════════════════════════════════════ */
    /*           LOGIN GATE SCREEN           */
    /* ══════════════════════════════════════ */
    function LoginGate({ onLogin }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const isLocalDev = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
      const [turnstileToken, setTurnstileToken] = useState(null);
      const [captchaError, setCaptchaError] = useState(false);
      const turnstileRef = useRef(null);

      useEffect(() => {
        if (isLocalDev) { setTurnstileToken('local-dev-skip'); return; }
        let widgetId = null;
        const renderWidget = () => {
          if (window.turnstile && turnstileRef.current) {
            widgetId = window.turnstile.render(turnstileRef.current, {
              sitekey: '0x4AAAAAACKJOBIKvTV3je0V',
              callback: (token) => { setTurnstileToken(token); setCaptchaError(false); },
              'error-callback': () => setCaptchaError(true),
              'expired-callback': () => setTurnstileToken(null),
              'action': 'turnstile-spin-v1',
              theme: 'light',
            });
          }
        };
        const waitForTurnstile = setInterval(() => {
          if (window.turnstile) { clearInterval(waitForTurnstile); renderWidget(); }
        }, 100);
        return () => {
          clearInterval(waitForTurnstile);
          if (widgetId && window.turnstile) window.turnstile.remove(widgetId);
        };
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!toText(username)) { setError('Vui lòng nhập tên đăng nhập'); return; }
        if (!toText(password)) { setError('Vui lòng nhập mật khẩu'); return; }
        if (!turnstileToken && !isLocalDev) { setError('Vui lòng xác thực CAPTCHA'); return; }
        setLoading(true); setError('');
        try {
          const res = await fetch(`${BACKEND_URL}auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: username.trim().toLowerCase(),
              password,
              ...(turnstileToken ? { cf_turnstile_response: turnstileToken } : {})
            })
          });
          const data = await res.json();
          if (!data.success) throw new Error(data.msg || 'Đăng nhập thất bại');
          safeStorage.local.setItem('ss_token', data.token);
          safeStorage.local.setItem('ss_user', data.user);
          onLogin(data.token, data.user);
        } catch (err) {
          setError(err.message || 'Không thể kết nối đến máy chủ.');
        } finally { setLoading(false); }
      };

      return (
        <div className="gate-bg">
          <div className="gate-card" style={{ animation: 'scaleIn .4s ease' }}>
            <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
              <div style={{
                width: 64, height: 64, borderRadius: 16, margin: '0 auto 16px',
                background: 'linear-gradient(135deg, #3b82f6, #8b5cf6)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: '0 8px 32px rgba(59,130,246,.4)'
              }}>
                <i data-lucide="ship" style={{ width: 32, height: 32, color: '#fff' }}></i>
              </div>
              <h1 style={{ color: '#fff', fontSize: '1.5rem', fontWeight: 800, margin: '0 0 6px' }}>
                Shipping Schedule
              </h1>
              <p style={{ color: 'rgba(255,255,255,.5)', fontSize: '.875rem', margin: 0 }}>
                Đăng nhập để truy cập hệ thống
              </p>
            </div>

            <form onSubmit={handleSubmit}>
              <div style={{ marginBottom: 16 }}>
                <label style={{ display: 'block', marginBottom: 6, color: 'rgba(255,255,255,.6)', fontSize: '.75rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.05em' }}>
                  Tên đăng nhập
                </label>
                <input
                  type="text" value={username}
                  onChange={e => { setUsername(e.target.value); setError(''); }}
                  placeholder="Nhập tên đăng nhập"
                  autoFocus
                  autoComplete="username"
                  style={{
                    width: '100%', padding: '14px 16px', borderRadius: 12,
                    border: `1px solid ${error ? '#ef4444' : 'rgba(255,255,255,.15)'}`,
                    background: 'rgba(255,255,255,.08)', color: '#fff', fontSize: '.9375rem',
                    outline: 'none', transition: '.2s'
                  }}
                />
              </div>

              <div style={{ marginBottom: 8 }}>
                <label style={{ display: 'block', marginBottom: 6, color: 'rgba(255,255,255,.6)', fontSize: '.75rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.05em' }}>
                  Mật khẩu
                </label>
                <div style={{ position: 'relative' }}>
                  <input
                    type={showPw ? 'text' : 'password'}
                    value={password}
                    onChange={e => { setPassword(e.target.value); setError(''); }}
                    placeholder="Nhập mật khẩu"
                    autoComplete="current-password"
                    style={{
                      width: '100%', padding: '14px 48px 14px 16px', borderRadius: 12,
                      border: `1px solid ${error ? '#ef4444' : 'rgba(255,255,255,.15)'}`,
                      background: 'rgba(255,255,255,.08)', color: '#fff', fontSize: '.9375rem',
                      outline: 'none', transition: '.2s'
                    }}
                  />
                  <button
                    type="button"
                    onClick={() => setShowPw(!showPw)}
                    style={{
                      position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)',
                      background: 'none', border: 'none', cursor: 'pointer', padding: 4,
                      color: 'rgba(255,255,255,.5)', display: 'flex'
                    }}
