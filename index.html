    function ImageModal({ url, styleName, sku, onClose, token, buyer, styleCode, filename }) {
      if (!url) return null;
      const dlName = `${(styleName || 'style').replace(/[^a-zA-Z0-9._\- ]/g, '')}_${(sku || 'sku').replace(/[^a-zA-Z0-9._\- ]/g, '')}.png`;
      const [imgSrc, setImgSrc] = useState(null);
      const [loadState, setLoadState] = useState('loading');

      useEffect(() => {
        setLoadState('loading');
        setImgSrc(null);
        if (!buyer || !styleCode || !filename || !token) {
          setLoadState('error');
          return;
        }
        fetch(`${BACKEND_URL}?action=imgdata&buyer=${encodeURIComponent(buyer)}&stylecode=${encodeURIComponent(styleCode)}&filename=${encodeURIComponent(filename)}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        })
          .then(r => r.json())
          .then(d => { if (d.success) { setImgSrc(d.data); setLoadState('loaded'); } else setLoadState('error'); })
          .catch(() => setLoadState('error'));
      }, [url, token, buyer, styleCode, filename]);

      const handleDownload = () => {
        const a = document.createElement('a');
        if (imgSrc) { a.href = imgSrc; a.download = dlName; }
        else { a.href = url; a.download = dlName; a.target = '_blank'; }
        document.body.appendChild(a); a.click(); a.remove();
      };

      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={e => e.stopPropagation()} style={{ minWidth: 320 }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px 20px', borderBottom: `1px solid var(--border)` }}>
              <div>
                <h3 style={{ margin: 0, fontSize: '.9375rem', fontWeight: 700, color: 'var(--text-primary)' }}>{styleName || 'Style Image'}</h3>
                <p style={{ margin: '2px 0 0', fontSize: '.75rem', color: 'var(--text-muted)' }}>{sku}</p>
              </div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button onClick={handleDownload} title="Tải xuống" style={{
                  width: 36, height: 36, borderRadius: 8, border: `1px solid var(--border)`,
                  background: 'var(--bg-card-alt)', cursor: 'pointer', display: 'flex',
                  alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)'
                }}>
                  <i data-lucide="download" style={{ width: 16, height: 16 }}></i>
                </button>
                <a href={url} target="_blank" rel="noreferrer" title="Mở tab mới" style={{
                  width: 36, height: 36, borderRadius: 8, border: `1px solid var(--border)`,
                  background: 'var(--bg-card-alt)', cursor: 'pointer', display: 'flex',
                  alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)',
                  textDecoration: 'none'
                }}>
                  <i data-lucide="external-link" style={{ width: 16, height: 16 }}></i>
                </a>
                <button onClick={onClose} title="Đóng" style={{
                  width: 36, height: 36, borderRadius: 8, border: `1px solid var(--border)`,
                  background: 'var(--bg-card-alt)', cursor: 'pointer', display: 'flex',
                  alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)'
                }}>
                  <i data-lucide="x" style={{ width: 16, height: 16 }}></i>
                </button>
              </div>
            </div>
            <div style={{ padding: 20, textAlign: 'center', maxHeight: '70vh', overflow: 'auto' }}>
              {loadState === 'loading' && (
                <div style={{ padding: '60px 20px', color: 'var(--text-muted)' }}>Đang tải ảnh...</div>
              )}
              {loadState === 'error' && (
                <p style={{ color: 'var(--text-muted)', padding: '40px' }}>Không thể tải hình ảnh</p>
              )}
              {loadState === 'loaded' && imgSrc && (
                <img src={imgSrc} alt={styleName || 'Style'}
                  style={{ maxWidth: '100%', maxHeight: '60vh', objectFit: 'contain', borderRadius: 8 }} />
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ══════════════════════════════════════ */
    /*            MAIN APP                   */
    /* ══════════════════════════════════════ */
    function App() {
      const [authenticated, setAuthenticated] = useState(false);
      const [token, setToken] = useState('');
      const [user, setUser] = useState('');
      const [darkMode, setDarkMode] = useState(() => safeStorage.local.getItem('ss_dark') === '1');
      const [factory, setFactory] = useState(() => safeStorage.local.getItem('ss_factory') || 'P2C1');
      const [buyer, setBuyer] = useState(() => safeStorage.local.getItem('ss_buyer') || '');
      const [styleFilter, setStyleFilter] = useState(() => safeStorage.local.getItem('ss_style') || '');
      const [startDate, setStartDate] = useState(TODAY_STR);
      const [endDate, setEndDate] = useState(ONE_WEEK_STR);
      const [aono, setAono] = useState('');
      const [data, setData] = useState(null);
      const [packageData, setPackageData] = useState(null);
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [filterStyle, setFilterStyle] = useState('');
      const [filterBuyer, setFilterBuyer] = useState('');
      const [filterSku, setFilterSku] = useState('');
      const [filterAo, setFilterAo] = useState('');
      const [filterStatus, setFilterStatus] = useState('');
      const [columnFilters, setColumnFilters] = useState({});
      const [sortConfig, setSortConfig] = useState({ key: 'exf', direction: 'asc' });
      const [openColumn, setOpenColumn] = useState(null);
      const [selectedBuyer, setSelectedBuyer] = useState(null);
      const [selectedAo, setSelectedAo] = useState(null);
      const [buyerOptions, setBuyerOptions] = useState([]);
      const [buyersLoading, setBuyersLoading] = useState(false);
      const [colorsLoading, setColorsLoading] = useState(false);
      const [colorCache, setColorCache] = useState(() => {
        try {
          return JSON.parse(safeStorage.session.getItem('ss_colors') || '{}');
        } catch (e) { return {}; }
      });
      const [imageModal, setImageModal] = useState(null);
      const callTimestamps = useRef([]);
      const queryInProgress = useRef(false);
      const colorsInProgress = useRef(false);
      const lastQueryTime = useRef(0);

      // Check saved token on mount
      useEffect(() => {
        const saved = safeStorage.local.getItem('ss_token');
        if (!saved) return;
        fetch(`${BACKEND_URL}auth/validate`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${saved}` }
        })
          .then(r => r.json())
          .then(d => {
            if (d.success) { setToken(saved); setUser(d.user); setAuthenticated(true); }
            else { safeStorage.local.removeItem('ss_token'); safeStorage.local.removeItem('ss_user'); }
          })
          .catch(() => { safeStorage.local.removeItem('ss_token'); safeStorage.local.removeItem('ss_user'); });
      }, []);

      // Dark mode toggle
      useEffect(() => {
        if (darkMode) { document.documentElement.classList.add('dark'); }
        else { document.documentElement.classList.remove('dark'); }
        safeStorage.local.setItem('ss_dark', darkMode ? '1' : '0');
      }, [darkMode]);

      // Close column filters menu on click outside
      useEffect(() => {
        const handleOutsideClick = (e) => {
          if (openColumn && !e.target.closest('.column-menu') && !e.target.closest('th button')) {
            setOpenColumn(null);
          }
        };
        document.addEventListener('mousedown', handleOutsideClick);
        return () => document.removeEventListener('mousedown', handleOutsideClick);
      }, [openColumn]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        window.setTimeout(() => setToast(null), 3600);
      };
      const saveFactory = v => { const next = upper(v) || 'P2C1'; setFactory(next); safeStorage.local.setItem('ss_factory', next); };
      const saveBuyer = v => { const next = upper(v); setBuyer(next); safeStorage.local.setItem('ss_buyer', next); };
      const saveStyle = v => { setStyleFilter(v); safeStorage.local.setItem('ss_style', v); };
      const clearTableFilters = () => { setFilterStyle(''); setFilterBuyer(''); setFilterSku(''); setFilterAo(''); setFilterStatus(''); setColumnFilters({}); setSelectedBuyer(null); setSelectedAo(null); };
      const setColumnFilter = (key, value) => setColumnFilters(prev => ({ ...prev, [key]: value }));
      const applySort = (key, direction) => { setSortConfig({ key, direction }); setOpenColumn(null); };

      const handleLogin = (token, user) => { setToken(token); setUser(user); setAuthenticated(true); };
      const handleLogout = () => {
        safeStorage.local.removeItem('ss_token');
        safeStorage.local.removeItem('ss_user');
        setToken(''); setUser(''); setAuthenticated(false);
        setData(null); setPackageData(null);
      };

      const checkRateLimit = () => {
        const now = Date.now(), windowMs = 60000;
        callTimestamps.current = callTimestamps.current.filter(t => now - t < windowMs);
        if (callTimestamps.current.length >= MAX_CALLS_PER_MIN) {
          const wait = Math.ceil((windowMs - (now - callTimestamps.current[0])) / 1000);
          throw new Error(`Vượt quá ${MAX_CALLS_PER_MIN} lần/phút. Vui lòng chờ ${wait}s.`);
        }
        callTimestamps.current.push(now);
      };

      async function handleQuery() {
        const now = Date.now();
        const secondsPassed = (now - lastQueryTime.current) / 1000;
        if (secondsPassed < 5) {
          const waitTime = Math.ceil(5 - secondsPassed);
          return showToast(`Vui lòng chờ ${waitTime}s trước lần truy vấn tiếp theo.`, 'warning');
        }

        if (queryInProgress.current) return;
        if (!toText(token)) return showToast('Vui lòng đăng nhập.', 'error');
        try { checkRateLimit(); } catch (e) { return showToast(e.message, 'error'); }

        lastQueryTime.current = now;
        queryInProgress.current = true;
        setLoading(true); setData(null); setPackageData(null); clearTableFilters();
        try {
          const [mesResult, pkgResult] = await Promise.allSettled([
            fetchApi({
              factory, buyer, aono, style: styleFilter,
              startdate: startDate,
              enddate: endDate
            }),
            fetchPackageDbData()
          ]);
          if (mesResult.status === 'rejected') throw mesResult.reason;
          const result = mesResult.value;
          setData(result);
          const pkgFailed = pkgResult.status === 'rejected';
          if (pkgResult.status === 'fulfilled') {
            setPackageData(pkgResult.value);
          } else {
            console.warn('Pkg DB fetch failed:', pkgResult.reason);
          }
          const total = result?.summary?.total_records ?? 0;
          const pkgCount = pkgResult.status === 'fulfilled' ? (pkgResult.value?.count ?? 0) : 0;
          let toastMsg = total ? `Tìm thấy ${formatNumber(total)} lệnh.` : 'Không tìm thấy dữ liệu trong khoảng thời gian này.';
          if (total && pkgCount) toastMsg += ` Pkg DB: ${formatNumber(pkgCount)} style.`;
          if (pkgFailed) toastMsg += ` (Pkg DB: ${pkgResult.reason?.message || 'lỗi không xác định'})`;
          showToast(toastMsg, total ? (pkgCount ? 'success' : 'warning') : 'warning');
          if (total > 0 && result.data) {
            const skus = [];
            result.data.forEach(style => {
              (style.skus || []).forEach(sku => {
                if (sku.sku_full) skus.push(sku.sku_full);
              });
            });
            const uniqueSkus = [...new Set(skus)].filter(Boolean);
            if (uniqueSkus.length > 0) {
              setTimeout(() => {
                loadColorsForSkus(uniqueSkus);
              }, 150);
            }
          }
        } catch (e) {
          if (e.message?.includes('hết hạn') || e.message?.includes('Unauthorized')) {
            handleLogout();
          }
          setData(null); showToast(e.message || 'Không thể truy vấn dữ liệu.', 'error');
        } finally {
          setLoading(false);
          queryInProgress.current = false;
        }
      }

      async function loadColorsForSkus(skus) {
        if (colorsInProgress.current) return;
        if (!skus.length || !toText(token)) return;

        colorsInProgress.current = true;
        setColorsLoading(true);
        const newCache = { ...colorCache };
        let loaded = 0;

        const missingSkus = skus.filter(sku => !newCache[sku]);
        if (missingSkus.length === 0) {
          setColorsLoading(false);
          colorsInProgress.current = false;
          showToast("Màu sắc đã được tải đầy đủ.", "success");
          return;
        }

        const concurrencyLimit = 5;
        const chunks = [];
        for (let i = 0; i < missingSkus.length; i += concurrencyLimit) {
          chunks.push(missingSkus.slice(i, i + concurrencyLimit));
        }

        try {
          for (const chunk of chunks) {
            await Promise.all(chunk.map(async (sku) => {
              try {
                const result = await fetchApi({ action: 'colorinfo', packageid: sku });
                newCache[sku] = result.color_name || '-';
                loaded++;
              } catch (e) {
                newCache[sku] = '-';
              }
            }));
            setColorCache({ ...newCache });
            safeStorage.session.setItem('ss_colors', JSON.stringify(newCache));
          }
          if (loaded > 0) showToast(`Đã tự động tải thêm ${loaded} màu sắc.`, 'success');
        } catch (err) {
          console.error("Lỗi khi tải màu sắc:", err);
        } finally {
          setColorsLoading(false);
          colorsInProgress.current = false;
        }
      }

      const summary = data?.summary;
      const records = Array.isArray(data?.data) ? data.data : [];
      const showRaw = data?.IsSuccess !== undefined && !summary;
      const packageLookup = useMemo(() => buildPackageLookup(packageData), [packageData]);

      const baseRows = useMemo(() => {
        const rows = [], pickedBuyer = upper(selectedBuyer), pickedAo = normalizeAo(selectedAo);
        records.forEach((style, si) => (style.skus || []).forEach((sku, ski) => (sku.ao_details || []).forEach((ao, ai) => {
          const skuFull = sku.sku_full || '';
          const pkgMatch = packageLookup.get(packageRowKey(skuFull, ao.ao_no || ''));
          const mxQty = pkgMatch ? pkgMatch.qty : null;
          const planQty = Number(ao.qty || 0);
          const mxDiff = mxQty != null ? planQty - mxQty : null;
          const row = {
            factory: ao.factory || style.factory || '',
            style: ao.style_code || style.style_code || style.style_name || '',
            styleName: ao.style_name || style.style_name || '',
            buyer: ao.buyer || style.buyer || '',
            buyerName: ao.buyer_name || style.buyer_name || '',
            dest: ao.dest || style.dest || '',
            sku: skuFull,
            color_code: ao.color_code || sku.color || '',
            size_code: ao.size_code || sku.size || '',
            color_name: colorCache[skuFull] || ao.color_name || '',
            ao_no: ao.ao_no || '',
            buyer_po: ao.buyer_po || '',
            exf: ao.ex_factory_date || style.ex_factory_date || '',
            prd_pkg: ao.prd_pkg || '',
            qty: ao.qty || 0,
            shipped_qty: ao.shipped_qty || 0,
            remain: ao.remain || 0,
            shipping_pkg: ao.shipping_pkg || '',
            filename: ao.filename || '',
            package_group: ao.package_group || '',
            image_url: ao.image_url || '',
            confirmed: ao.confirmed || false,
            status: ao.status || '',
            mx_qty: mxQty,
            mx_packages: pkgMatch ? pkgMatch.packages_count : null,
            mx_diff: mxDiff,
            mx_unreported: mxDiff == null ? planQty : Math.max(mxDiff, 0),
            rowKey: `${si}-${ski}-${ai}-${skuFull}-${ao.ao_no || ''}`
          };
          if (pickedBuyer && upper(row.buyer) !== pickedBuyer) return;
          if (pickedAo && normalizeAo(row.ao_no) !== pickedAo) return;
          rows.push(row);
        })));
        return rows;
      }, [records, selectedBuyer, selectedAo, colorCache, packageLookup]);

      const flatRows = useMemo(() => baseRows.filter(row => {
        const statusText = upper(row.status), confirmed = Boolean(row.confirmed);
        const rowStatus = confirmed || statusText === 'CF' ? 'CF' : 'RO';
        const columnValues = {
          factory: row.factory, buyer: row.buyer, dest: row.dest, style: row.style,
          ao_no: row.ao_no, style_name: row.styleName, color_name: row.color_name,
          size_code: row.size_code, buyer_po: row.buyer_po, qty: row.qty,
          shipped_qty: row.shipped_qty, remain: row.remain, exf: fmtDisplayDate(row.exf),
          shipping_pkg: row.shipping_pkg, prd_pkg: row.prd_pkg, sku: row.sku,
          package_group: row.package_group, status: rowStatus,
          mx_qty: row.mx_qty, mx_packages: row.mx_packages,
          mx_unreported: row.mx_unreported
        };
        if (!includesText(row.style, filterStyle) && !includesText(row.styleName, filterStyle)) return false;
        if (!includesText(row.buyer, filterBuyer) && !includesText(row.buyerName, filterBuyer)) return false;
        if (!includesText(row.sku, filterSku)) return false;
        if (toText(filterAo) && !normalizeAo(row.ao_no).includes(normalizeAo(filterAo))) return false;
        if (filterStatus === 'CF' && rowStatus !== 'CF') return false;
        if (filterStatus === 'RO' && rowStatus !== 'RO') return false;
        return Object.entries(columnFilters).every(([key, value]) => !toText(value) || includesText(columnValues[key], value));
      }), [baseRows, filterStyle, filterBuyer, filterSku, filterAo, filterStatus, columnFilters]);

      const sortedRows = useMemo(() => {
        const { key, direction } = sortConfig;
        const factor = direction === 'desc' ? -1 : 1;
        return [...flatRows].sort((a, b) => {
          const getValue = row => {
            if (key === 'status') return Boolean(row.confirmed) || upper(row.status) === 'CF' ? 'CF' : 'RO';
            if (key === 'exf') return toText(row.exf);
            if (['qty', 'shipped_qty', 'remain', 'mx_qty', 'mx_packages', 'mx_unreported'].includes(key)) {
              const val = row[key];
              return val == null ? null : Number(val || 0);
            }
            return upper(row[key]);
          };
          const av = getValue(a), bv = getValue(b);
          if (av == null && bv == null) return 0;
          if (av == null) return 1;
          if (bv == null) return -1;
          if (typeof av === 'number' || typeof bv === 'number') return (av - bv) * factor;
          return String(av).localeCompare(String(bv), 'vi', { numeric: true }) * factor;
        });
      }, [flatRows, sortConfig]);

      const totals = useMemo(() => sortedRows.reduce((a, r) => ({
        plan: a.plan + Number(r.qty || 0),
        actual: a.actual + Number(r.shipped_qty || 0),
        remain: a.remain + Number(r.remain || 0),
        dbQty: a.dbQty + (r.mx_qty != null ? Number(r.mx_qty || 0) : 0),
        dbPackages: a.dbPackages + (r.mx_packages != null ? Number(r.mx_packages || 0) : 0),
        dbUnreported: a.dbUnreported + Number(r.mx_unreported || 0)
      }), { plan: 0, actual: 0, remain: 0, dbQty: 0, dbPackages: 0, dbUnreported: 0 }), [sortedRows]);

      const aggregateRows = useCallback((rows, keyField) => {
        const map = new Map();
        rows.forEach(row => {
          const key = keyField === 'buyer' ? row.buyer : row.ao_no;
          const mapKey = key || '';
          if (!map.has(mapKey)) {
            map.set(mapKey, { [keyField]: key, plan: 0, actual: 0, remain: 0, dbQty: 0, dbPackages: 0, dbUnreported: 0 });
          }
          const item = map.get(mapKey);
          item.plan += Number(row.qty || 0);
          item.actual += Number(row.shipped_qty || 0);
          item.remain += Number(row.remain || 0);
          if (row.mx_qty != null) item.dbQty += Number(row.mx_qty || 0);
          if (row.mx_packages != null) item.dbPackages += Number(row.mx_packages || 0);
          item.dbUnreported += Number(row.mx_unreported || 0);
        });
        return [...map.values()].sort((a, b) => upper(a[keyField]).localeCompare(upper(b[keyField]), 'vi', { numeric: true }));
      }, []);

      const summaryRows = useMemo(() => ({
        byBuyer: aggregateRows(flatRows, 'buyer'),
        byAo: aggregateRows(flatRows, 'ao_no')
      }), [flatRows, aggregateRows]);
      const hasFilters = Boolean(filterStyle || filterBuyer || filterSku || filterAo || filterStatus || Object.values(columnFilters).some(toText) || selectedBuyer || selectedAo);

      /* ── Styled XLSX Export using ExcelJS ── */
      const exportXlsx = async () => {
        if (!sortedRows.length) return showToast('Không có dữ liệu để xuất.', 'warning');
        if (!window.ExcelJS) return showToast('Thư viện xuất XLSX chưa tải xong.', 'warning');

        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet('Shipping Schedule');

        // Define columns
        worksheet.columns = [
          { header: 'Factory', key: 'factory', width: 10 },
          { header: 'Buyer', key: 'buyer', width: 10 },
          { header: 'Dest', key: 'dest', width: 8 },
          { header: 'Style Code', key: 'style', width: 16 },
          { header: 'AO No', key: 'ao_no', width: 16 },
          { header: 'Style Name', key: 'styleName', width: 32 },
          { header: 'Color', key: 'color_name', width: 20 },
          { header: 'Size', key: 'size_code', width: 8 },
          { header: 'Buyer PO', key: 'buyer_po', width: 18 },
          { header: 'Qty', key: 'qty', width: 14 },
          { header: 'Đã xuất', key: 'shipped_qty', width: 16 },
          { header: 'Chưa xuất', key: 'remain', width: 14 },
          { header: 'SL đã báo cáo', key: 'mx_qty', width: 16 },
          { header: 'Còn lại', key: 'mx_unreported', width: 16 },
          { header: 'SL PKG', key: 'mx_packages', width: 12 },
          { header: 'Ngày xuất', key: 'exf', width: 15 },
          { header: 'SHPPKG', key: 'shipping_pkg', width: 12 },
          { header: 'PRDPKG', key: 'prd_pkg', width: 12 },
          { header: 'SKU', key: 'sku', width: 26 },
          { header: 'Package Group', key: 'package_group', width: 16 },
          { header: 'Trạng thái', key: 'status', width: 12 }
        ];

        // Add data rows
        sortedRows.forEach(row => {
          worksheet.addRow({
            factory: row.factory || '',
            buyer: row.buyer || '',
            dest: row.dest || '',
            style: row.style || '',
            ao_no: row.ao_no || '',
            styleName: row.styleName || '',
            color_name: row.color_name || '',
            size_code: row.size_code || '',
            buyer_po: row.buyer_po || '',
            qty: Number(row.qty || 0),
            shipped_qty: Number(row.shipped_qty || 0),
            remain: Number(row.remain || 0),
            mx_qty: row.mx_qty != null ? Number(row.mx_qty) : '',
            mx_packages: row.mx_packages != null ? Number(row.mx_packages) : '',
            mx_unreported: Number(row.mx_unreported || 0),
            exf: fmtDisplayDate(row.exf),
            shipping_pkg: row.shipping_pkg || '',
            prd_pkg: row.prd_pkg || '',
            sku: row.sku || '',
            package_group: row.package_group || '',
            status: Boolean(row.confirmed) || upper(row.status) === 'CF' ? 'CF' : 'RO'
          });
        });

        // Add totals row
        worksheet.addRow({
          buyer_po: 'TỔNG CỘNG',
          qty: totals.plan,
          shipped_qty: totals.actual,
          remain: totals.remain,
          mx_qty: totals.dbQty,
          mx_packages: totals.dbPackages,
          mx_unreported: totals.dbUnreported
        });

        // Style header row
        const headerRow = worksheet.getRow(1);
        headerRow.height = 28;
        headerRow.eachCell(cell => {
          cell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: '0F172A' }
          };
          cell.font = {
            name: 'Arial',
            size: 10,
            bold: true,
            color: { argb: 'FFFFFF' }
          };
          cell.alignment = { vertical: 'middle', horizontal: 'center' };
          cell.border = {
            top: { style: 'thin', color: { argb: '334155' } },
            left: { style: 'thin', color: { argb: '334155' } },
            bottom: { style: 'thin', color: { argb: '334155' } },
            right: { style: 'thin', color: { argb: '334155' } }
          };
        });

        // Format data rows and totals row
        worksheet.eachRow((row, rowNumber) => {
          if (rowNumber === 1) return; // Skip header

          const isTotal = rowNumber === worksheet.rowCount;
          row.height = 20;

          row.eachCell((cell, colNumber) => {
            cell.font = {
              name: 'Arial',
              size: 9,
              bold: isTotal ? true : [1, 4, 10, 11, 12, 13, 14, 15].includes(colNumber)
            };

            // Alignments & Number formats
            if ([10, 11, 12, 13, 14, 15].includes(colNumber)) { // Numeric fields
              cell.numFmt = '#,##0';
              cell.alignment = { vertical: 'middle', horizontal: 'right' };
            } else if ([1, 2, 3, 8, 16, 21].includes(colNumber)) {
              cell.alignment = { vertical: 'middle', horizontal: 'center' };
            } else {
              cell.alignment = { vertical: 'middle', horizontal: 'left' };
            }

            // Colors and style decorators
            if (!isTotal) {
              if (colNumber === 10) {
                cell.font.color = { argb: '3B82F6' }; // Accent plan color
              } else if (colNumber === 11) {
                cell.font.color = { argb: '059669' }; // Shipped green
              } else if (colNumber === 12) {
                const remainVal = Number(cell.value || 0);
                cell.font.color = { argb: remainVal > 0 ? 'DC2626' : '059669' }; // Remain red/green
              } else if (colNumber === 13) {
                cell.font.color = { argb: '7C3AED' }; // Pkg DB qty
              } else if (colNumber === 14) {
                const unreportedVal = Number(cell.value || 0);
                cell.font.color = { argb: unreportedVal === 0 ? '059669' : 'EA580C' };
              } else if (colNumber === 21) { // Status cell
                const statusVal = cell.value;
                if (statusVal === 'CF') {
                  cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'D1FAE5' } };
                  cell.font.color = { argb: '065F46' };
                } else {
                  cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FEF3C7' } };
                  cell.font.color = { argb: '92400E' };
                }
              }
            }

            // Borders
            cell.border = {
              top: { style: 'thin', color: { argb: 'E2E8F0' } },
              left: { style: 'thin', color: { argb: 'E2E8F0' } },
              bottom: { style: 'thin', color: { argb: 'E2E8F0' } },
              right: { style: 'thin', color: { argb: 'E2E8F0' } }
            };

            if (isTotal) {
              cell.fill = {
                type: 'pattern',
                pattern: 'solid',
                fgColor: { argb: 'F1F5F9' }
              };
              cell.border.top = { style: 'medium', color: { argb: '0F172A' } };
            }
          });
        });

        // Save file asynchronously
        const buffer = await workbook.xlsx.writeBuffer();
        saveAs(new Blob([buffer]), `shipping_schedule_${toYyyymmdd(new Date())}.xlsx`);
        showToast('Đã xuất file Excel định dạng cao cấp.', 'success');
      };

      useEffect(() => {
        if (!toText(token) || !authenticated) { setBuyerOptions([]); return; }
        let ignore = false;
        setBuyersLoading(true);
        fetchBuyerList()
          .then(result => {
            if (!ignore) {
              let buyers = [];
              if (Array.isArray(result.buyers)) buyers = result.buyers;
              else if (Array.isArray(result.Result)) buyers = result.Result;
              setBuyerOptions(buyers);
            }
          })
          .catch(() => { if (!ignore) setBuyerOptions([]); })
          .finally(() => { if (!ignore) setBuyersLoading(false); });
        return () => { ignore = true; };
      }, [token, authenticated]);

      /* ── Render gate if not authenticated ── */
      if (!authenticated) return <LoginGate onLogin={handleLogin} />;

      return (
        <div style={{ minHeight: '100vh' }}>
          <Toast toast={toast} />
          {imageModal && (
            <ImageModal
              url={imageModal.url}
              styleName={imageModal.styleName}
              sku={imageModal.sku}
              token={token}
              buyer={imageModal.buyer}
              styleCode={imageModal.styleCode}
              filename={imageModal.filename}
              onClose={() => setImageModal(null)}
            />
          )}

          {/* ── Header ── */}
          <header style={{ borderBottom: `1px solid var(--border)`, background: 'var(--bg-header)' }}>
            <div style={{ maxWidth: 1500, margin: '0 auto', padding: '16px 20px', display: 'flex', flexDirection: 'column', gap: 16 }}>
              {/* Top bar */}
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <div style={{
                    width: 44, height: 44, borderRadius: 12,
                    background: 'linear-gradient(135deg, #3b82f6, #8b5cf6)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    boxShadow: '0 4px 12px rgba(59,130,246,.3)'
                  }}>
                    <i data-lucide="ship" style={{ width: 22, height: 22, color: '#fff' }}></i>
                  </div>
                  <div>
                    <p style={{ margin: 0, fontSize: '.6875rem', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '.15em', color: 'var(--text-muted)' }}>MES Shipping</p>
                    <h1 style={{ margin: 0, fontSize: '1.375rem', fontWeight: 800, color: 'var(--text-primary)' }}>Shipping Schedule Dashboard</h1>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                  {user && (
                    <span style={{
                      padding: '6px 12px', borderRadius: 999,
                      border: `1px solid var(--border)`, background: 'var(--bg-card-alt)',
                      fontSize: '.75rem', fontWeight: 700, color: 'var(--accent)'
                    }}>
                      <i data-lucide="user" style={{ width: 14, height: 14, marginRight: 4 }}></i>
                      {user}
                    </span>
                  )}
                  <span style={{ padding: '6px 12px', borderRadius: 999, border: `1px solid var(--border)`, background: 'var(--bg-card-alt)', fontSize: '.75rem', color: 'var(--text-muted)' }}>
                    Hôm nay: {fmtDisplayDate(TODAY_STR)}
                  </span>
                  {data?.server_time && (
                    <span style={{ padding: '6px 12px', borderRadius: 999, border: `1px solid var(--border)`, background: 'var(--bg-card-alt)', fontSize: '.75rem', color: 'var(--text-muted)' }}>
                      Cập nhật: {new Date(data.server_time).toLocaleString('vi-VN')}
                    </span>
                  )}
                  {/* Dark mode toggle */}
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    title={darkMode ? 'Chế độ sáng' : 'Chế độ tối'}
                    style={{
                      width: 40, height: 40, borderRadius: 10, border: `1px solid var(--border)`,
                      background: 'var(--bg-card-alt)', cursor: 'pointer', display: 'flex',
                      alignItems: 'center', justifyContent: 'center', color: 'var(--text-secondary)',
                      transition: '.2s'
                    }}
                  >
                    <i data-lucide={darkMode ? 'sun' : 'moon'} style={{ width: 18, height: 18 }}></i>
                  </button>
                  {/* Logout */}
                  <button
                    onClick={handleLogout}
                    title="Đăng xuất"
                    style={{
                      width: 40, height: 40, borderRadius: 10, border: '1px solid #fecdd3',
                      background: darkMode ? '#4c1d2c' : '#fff1f2', cursor: 'pointer', display: 'flex',
                      alignItems: 'center', justifyContent: 'center', color: '#be123c', transition: '.2s'
                    }}
                  >
                    <i data-lucide="log-out" style={{ width: 18, height: 18 }}></i>
                  </button>
                </div>
              </div>

              {/* Query form */}
              <section style={{ borderRadius: 12, border: `1px solid var(--border)`, background: 'var(--bg-card-alt)', padding: 16, boxShadow: '0 1px 3px rgba(0,0,0,.06)' }} onKeyDown={e => e.key === 'Enter' && handleQuery()}>
                <div style={{ display: 'grid', gap: 12, gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))' }}>
                  <Field label="Factory">
                    <select value={factory} onChange={e => saveFactory(e.target.value)} className="input" style={{ cursor: 'pointer' }}>
                      {FACTORIES.map(f => <option key={f} value={f}>{f}</option>)}
                    </select>
                  </Field>
                  <Field label="Buyer">
                    <div style={{ position: 'relative' }}>
                      <input
                        list="buyer-options" value={buyer}
                        onChange={e => saveBuyer(e.target.value)}
                        placeholder={buyersLoading ? 'Đang tải...' : 'Gõ hoặc chọn'}
                        className="input" style={{ textTransform: 'uppercase' }}
                        disabled={buyersLoading}
                      />
                      <datalist id="buyer-options">
                        {buyerOptions.map(item => (
                          <option key={item.BUYER_CODE} value={item.BUYER_CODE}>{item.BUYER_NAME}</option>
                        ))}
                      </datalist>
                    </div>
                  </Field>
                  <Field label="AO No">
                    <input value={aono} onChange={e => setAono(upper(e.target.value))} placeholder="Mã AO" className="input" style={{ textTransform: 'uppercase' }} />
                  </Field>
                  <Field label="Style / Tên SP">
                    <input value={styleFilter} onChange={e => saveStyle(e.target.value)} placeholder="Style hoặc tên SP" className="input" />
                  </Field>
                  <Field label="Từ ngày">
                    <input type="date" value={fmtDateInput(startDate)} onChange={e => setStartDate(parseDateInput(e.target.value))} className="input" />
                  </Field>
                  <Field label="Đến ngày">
                    <input type="date" value={fmtDateInput(endDate)} onChange={e => setEndDate(parseDateInput(e.target.value))} className="input" />
                  </Field>
                  <div style={{ display: 'flex', alignItems: 'flex-end', gap: 8 }}>
                    <button onClick={() => { setStartDate(TODAY_STR); setEndDate(ONE_WEEK_STR); }} className="btn btn-secondary" type="button" style={{ flex: 1 }}>
                      <i data-lucide="calendar-days" style={{ width: 15, height: 15 }}></i>Tuần này
                    </button>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'flex-end' }}>
                    <button onClick={handleQuery} disabled={loading} className="btn btn-primary" type="button" style={{ flex: 1 }}>
                      {loading ? (<><i data-lucide="loader-2" style={{ width: 15, height: 15, animation: 'spin .8s linear infinite' }}></i>Đang tải</>) : (<><i data-lucide="search" style={{ width: 15, height: 15 }}></i>Truy vấn</>)}
                    </button>
                  </div>
                </div>
              </section>
            </div>
          </header>

          {/* ── Main content ── */}
          <main style={{ maxWidth: 1500, margin: '0 auto', padding: '20px 20px' }}>
            {summary && !showRaw && (
              <>
                {/* Metric cards */}
                <section style={{ display: 'grid', gap: 12, gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', marginBottom: 20 }}>
                  <MetricCard label="Tổng số lệnh" value={formatNumber(summary.total_records)} icon="database" gradient="stat-gradient-total" />
                  <MetricCard label="Tổng kế hoạch" value={formatNumber(summary.total_plan_qty)} icon="package" gradient="stat-gradient-plan" />
                  <MetricCard label="Đã xuất" value={formatNumber(summary.total_actual_qty)} icon="check-circle-2" gradient="stat-gradient-shipped" />
                  <MetricCard label="Chưa xuất" value={formatNumber(summary.total_remain_qty)} icon="alert-circle" gradient="stat-gradient-remain" />
                  <MetricCard label="Hoàn thành" value={summary.completion_rate || '0%'} icon="trending-up" gradient="stat-gradient-rate" />
                </section>

                {/* Summary tables */}
                <section style={{ display: 'grid', gap: 16, gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))', marginBottom: 20 }}>
                  <SummaryTable title="Theo Buyer" icon="users" rows={summaryRows.byBuyer} keyField="buyer" selected={selectedBuyer} onSelect={v => setSelectedBuyer(selectedBuyer === v ? null : v)} />
                  <SummaryTable title="Theo AO" icon="boxes" rows={summaryRows.byAo} keyField="ao_no" selected={selectedAo} onSelect={v => setSelectedAo(selectedAo === v ? null : v)} />
                </section>

                {/* Detail table section */}
                <section style={{ borderRadius: 12, border: `1px solid var(--border)`, background: 'var(--bg-card)', boxShadow: '0 1px 3px rgba(0,0,0,.06)', overflow: 'hidden' }}>
                  <div className="no-print" style={{ padding: 16, borderBottom: `1px solid var(--border)` }}>
                    <div style={{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', justifyContent: 'space-between', gap: 12, marginBottom: 12 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                        <i data-lucide="list-filter" style={{ width: 20, height: 20, color: 'var(--text-muted)' }}></i>
                        <h2 style={{ margin: 0, fontSize: '1.0625rem', fontWeight: 800, color: 'var(--text-primary)' }}>Chi tiết Style / SKU / AO</h2>
                        {packageData && (
                          <span style={{
                            fontSize: '.6875rem', fontWeight: 700, padding: '3px 8px', borderRadius: 999,
                            background: 'rgba(124,58,237,.12)', color: '#7c3aed'
                          }}>Pkg DB: {formatNumber(packageData.count || 0)} style</span>
                        )}
                      </div>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                        {selectedBuyer && <FilterChip label={`Buyer: ${selectedBuyer}`} onClear={() => setSelectedBuyer(null)} />}
                        {selectedAo && <FilterChip label={`AO: ${selectedAo}`} onClear={() => setSelectedAo(null)} />}
                        {hasFilters && <button onClick={clearTableFilters} className="btn btn-danger" type="button"><i data-lucide="x" style={{ width: 15, height: 15 }}></i>Xóa lọc</button>}
                        {sortedRows.length > 0 && (
                          <>
                            <button onClick={() => {
                              const uniqueSkus = [...new Set(sortedRows.map(r => r.sku).filter(Boolean))];
                              loadColorsForSkus(uniqueSkus);
                            }} disabled={colorsLoading} className="btn btn-secondary no-print" type="button">
                              {colorsLoading ? (<><i data-lucide="loader-2" style={{ width: 15, height: 15, animation: 'spin .8s linear infinite' }}></i>Đang tải màu...</>) : (<><i data-lucide="palette" style={{ width: 15, height: 15 }}></i>Tải màu sắc</>)}
                            </button>
                            <button onClick={exportXlsx} className="btn btn-primary no-print" type="button">
                              <i data-lucide="file-spreadsheet" style={{ width: 15, height: 15 }}></i>Tải XLSX
                            </button>
                          </>
                        )}
                      </div>
                    </div>

                    {/* Summary banner */}
                    <div className="summary-banner">
                      <div className="summary-row">
                        <span style={{ fontSize: '.8125rem', fontWeight: 600, opacity: .8 }}>Tổng hợp:</span>
                        <span className="summary-badge" style={{ background: 'rgba(255,255,255,.12)' }}>
                          <i data-lucide="rows-3" style={{ width: 13, height: 13 }}></i>
                          {formatNumber(sortedRows.length)} dòng
                        </span>
                      </div>
                      <div className="summary-row">
                        <span style={{ fontSize: '.6875rem', fontWeight: 800, opacity: .75, textTransform: 'uppercase' }}>Xuất hàng thực tế</span>
                        <span className="summary-badge" style={{ background: 'rgba(59,130,246,.25)' }}>
                          <i data-lucide="package" style={{ width: 13, height: 13 }}></i>
                          Qty: {formatNumber(totals.plan)}
                        </span>
                        <span className="summary-badge" style={{ background: 'rgba(16,185,129,.28)' }}>
                          <i data-lucide="check-circle-2" style={{ width: 13, height: 13 }}></i>
                          ĐÃ XUẤT: {formatNumber(totals.actual)}
                        </span>
                        <span className="summary-badge" style={{ background: 'rgba(239,68,68,.28)' }}>
                          <i data-lucide="alert-circle" style={{ width: 13, height: 13 }}></i>
                          CHƯA XUẤT: {formatNumber(totals.remain)}
                        </span>
                      </div>
                      <div className="summary-row">
                        <span style={{ fontSize: '.6875rem', fontWeight: 800, opacity: .75, textTransform: 'uppercase' }}>Báo cáo sản xuất DB</span>
                        <span className="summary-badge" style={{
                          background: totals.dbQty > 0 && totals.dbQty >= totals.plan ? 'rgba(16,185,129,.2)' : 'rgba(124,58,237,.25)'
                        }}>
                          <i data-lucide="database" style={{ width: 13, height: 13 }}></i>
                          SL ĐÃ BÁO CÁO: {formatNumber(totals.dbQty)}
                          {totals.dbQty > 0 && totals.dbQty >= totals.plan ? ' ✅' : ''}
                        </span>
                        <span className="summary-badge" style={{ background: 'rgba(234,88,12,.28)' }} title="Dòng chưa có DB được tính bằng toàn bộ Qty; dòng có DB tính phần Qty còn thiếu so với SL đã báo cáo.">
                          <i data-lucide="clipboard-x" style={{ width: 13, height: 13 }}></i>
                          CÒN LẠI: {formatNumber(totals.dbUnreported)}
                        </span>
                        <span className="summary-badge" style={{ background: 'rgba(99,102,241,.25)' }}>
                          <i data-lucide="boxes" style={{ width: 13, height: 13 }}></i>
                          SL PKG: {formatNumber(totals.dbPackages)}
                        </span>
                      </div>
                    </div>

                    {/* Quick filters */}
                    <div style={{ marginTop: 12, display: 'grid', gap: 10, gridTemplateColumns: 'repeat(auto-fit, minmax(140px, 1fr))' }}>
                      <input value={filterStyle} onChange={e => setFilterStyle(e.target.value)} placeholder="Lọc Style / tên SP" className="filter-input" />
                      <input value={filterBuyer} onChange={e => setFilterBuyer(e.target.value)} placeholder="Lọc Buyer" className="filter-input" style={{ textTransform: 'uppercase' }} />
                      <input value={filterSku} onChange={e => setFilterSku(e.target.value)} placeholder="Lọc SKU" className="filter-input" />
                      <input value={filterAo} onChange={e => setFilterAo(e.target.value)} placeholder="Lọc AO" className="filter-input" style={{ textTransform: 'uppercase' }} />
                      <select value={filterStatus} onChange={e => setFilterStatus(e.target.value)} className="filter-input" style={{ cursor: 'pointer' }}>
                        <option value="">Tất cả trạng thái</option>
                        <option value="CF">CF</option>
                        <option value="RO">RO</option>
                      </select>
                    </div>
                  </div>
                  <div style={{ maxHeight: 620, overflow: 'auto' }}>
                    {flatRows.length === 0 ? (
                      <EmptyState hasData={baseRows.length > 0} />
                    ) : (
                      <DetailTable
                        rows={sortedRows} sortConfig={sortConfig} applySort={applySort}
                        openColumn={openColumn} setOpenColumn={setOpenColumn}
                        columnFilters={columnFilters} setColumnFilter={setColumnFilter}
                        onImageClick={(url, styleName, sku, buyer, styleCode, filename) => setImageModal({ url, styleName, sku, buyer, styleCode, filename })}
                      />
                    )}
                  </div>
                </section>
              </>
            )}

            {showRaw && data && (
              <section style={{ borderRadius: 12, border: `1px solid var(--border)`, background: 'var(--bg-card)', padding: 16, boxShadow: '0 1px 3px rgba(0,0,0,.06)' }}>
                <h2 style={{ margin: '0 0 12px', fontSize: '1rem', fontWeight: 700, color: 'var(--text-primary)' }}>Dữ liệu thô từ MES</h2>
                <pre style={{ maxHeight: 620, overflow: 'auto', borderRadius: 8, background: '#0f172a', padding: 16, fontSize: '.75rem', color: '#e2e8f0' }}>{JSON.stringify(data, null, 2)}</pre>
              </section>
            )}

            {!data && !loading && (
              <section style={{ display: 'flex', minHeight: 360, alignItems: 'center', justifyContent: 'center', borderRadius: 12, border: `2px dashed var(--border)`, background: 'var(--bg-card)' }}>
                <div style={{ maxWidth: 400, padding: 24, textAlign: 'center' }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: 16, margin: '0 auto 16px',
                    background: 'var(--bg-card-alt)', display: 'flex', alignItems: 'center', justifyContent: 'center',
                    color: 'var(--text-muted)'
                  }}>
                    <i data-lucide="search-check" style={{ width: 28, height: 28 }}></i>
                  </div>
                  <h2 style={{ margin: '0 0 8px', fontSize: '1.125rem', fontWeight: 700, color: 'var(--text-primary)' }}>Sẵn sàng truy vấn lịch xuất hàng</h2>
                  <p style={{ margin: 0, fontSize: '.875rem', color: 'var(--text-muted)' }}>Nhập điều kiện cần tìm, sau đó bấm Truy vấn để tải dữ liệu từ MES.</p>
                </div>
              </section>
            )}
          </main>
        </div>
      );
    }

    /* ══════════════════════════════════════ */
    /*        SUB-COMPONENTS                 */
    /* ══════════════════════════════════════ */

    function Toast({ toast }) {
      if (!toast) return null;
      const configs = {
        error:   { bg: '#fef2f2', border: '#fecaca', color: '#991b1b', icon: 'alert-circle' },
        warning: { bg: '#fffbeb', border: '#fed7aa', color: '#92400e', icon: 'alert-triangle' },
        success: { bg: '#f0fdf4', border: '#bbf7d0', color: '#166534', icon: 'check-circle-2' }
      };
      const c = configs[toast.type] || configs.success;
      return (
        <div style={{
          position: 'fixed', right: 16, top: 16, zIndex: 200, display: 'flex', alignItems: 'center', gap: 8,
          padding: '12px 16px', borderRadius: 10, border: `1px solid ${c.border}`, background: c.bg,
          color: c.color, fontSize: '.8125rem', fontWeight: 600, boxShadow: '0 8px 24px rgba(0,0,0,.12)',
          animation: 'slideDown .3s ease', maxWidth: 400
        }}>
          <i data-lucide={c.icon} style={{ width: 16, height: 16, flexShrink: 0 }}></i>
          <span>{toast.message}</span>
        </div>
      );
    }

    function Field({ label, children }) {
      return (
        <label style={{ display: 'block' }}>
          <span style={{ display: 'block', marginBottom: 5, fontSize: '.6875rem', fontWeight: 700, textTransform: 'uppercase', color: 'var(--text-muted)', letterSpacing: '.04em' }}>{label}</span>
          {children}
        </label>
      );
    }

    function MetricCard({ label, value, icon, gradient }) {
      return (
        <article className={gradient} style={{ borderRadius: 12, padding: '18px 20px', color: '#fff', boxShadow: '0 4px 16px rgba(0,0,0,.12)' }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8 }}>
            <div>
              <p style={{ margin: 0, fontSize: '.6875rem', fontWeight: 700, textTransform: 'uppercase', opacity: .7, letterSpacing: '.04em' }}>{label}</p>
              <p style={{ margin: '8px 0 0', fontSize: '1.625rem', fontWeight: 900, letterSpacing: '-.02em' }}>{value ?? '-'}</p>
            </div>
            <div style={{ width: 40, height: 40, borderRadius: 10, background: 'rgba(255,255,255,.15)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <i data-lucide={icon} style={{ width: 20, height: 20 }}></i>
            </div>
          </div>
        </article>
      );
    }

    function SummaryTable({ title, icon, rows, keyField, selected, onSelect }) {
      return (
        <section style={{ borderRadius: 12, border: `1px solid var(--border)`, background: 'var(--bg-card)', boxShadow: '0 1px 3px rgba(0,0,0,.06)', overflow: 'hidden' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px', borderBottom: `1px solid var(--border)` }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <i data-lucide={icon} style={{ width: 18, height: 18, color: 'var(--text-muted)' }}></i>
              <h2 style={{ margin: 0, fontSize: '.9375rem', fontWeight: 700, color: 'var(--text-primary)' }}>{title}</h2>
            </div>
            <span style={{ padding: '4px 10px', borderRadius: 999, background: 'var(--bg-card-alt)', fontSize: '.6875rem', fontWeight: 700, color: 'var(--text-muted)' }}>{formatNumber(rows.length)} mục</span>
          </div>
          <div style={{ maxHeight: 320, overflow: 'auto' }}>
            <table style={{ minWidth: 760, width: '100%', fontSize: '.8125rem', borderCollapse: 'collapse' }}>
              <thead>
                <tr style={{ position: 'sticky', top: 0, background: 'var(--bg-card-alt)', fontSize: '.6875rem', textTransform: 'uppercase', color: 'var(--text-muted)' }}>
                  <Th>{keyField === 'buyer' ? 'Buyer' : 'AO No'}</Th>
                  <Th right>Qty</Th>
                  <Th right>ĐÃ XUẤT</Th>
                  <Th right>CHƯA XUẤT</Th>
                  <Th right>SL ĐÃ BÁO CÁO</Th>
                  <Th right>CÒN LẠI</Th>
                  <Th right>SL PKG</Th>
                </tr>
              </thead>
              <tbody>
                {rows.map((row, index) => {
                  const value = row[keyField]; const active = selected === value;
                  return (
                    <tr key={`${value||'e'}-${index}`} onClick={() => onSelect(value)}
                      style={{ cursor: 'pointer', borderBottom: `1px solid var(--border)`, background: active ? 'rgba(59,130,246,.08)' : 'transparent', transition: '.15s' }}
                      onMouseEnter={e => { if (!active) e.currentTarget.style.background = 'var(--bg-card-alt)'; }}
                      onMouseLeave={e => { if (!active) e.currentTarget.style.background = 'transparent'; }}
                    >
                      <Td strong>{value || '-'}</Td>
                      <Td right>{formatNumber(row.plan)}</Td>
                      <Td right style={{ background: 'rgba(16,185,129,.08)', color: '#059669', fontWeight: 800 }}>{formatNumber(row.actual)}</Td>
                      <Td right style={{ background: 'rgba(239,68,68,.08)', color: '#dc2626', fontWeight: 800 }}>{formatNumber(row.remain)}</Td>
                      <Td right style={{
                        color: row.dbQty > 0 && row.dbQty >= row.plan ? '#059669' : '#7c3aed',
                        fontWeight: 700,
                        background: row.dbQty > 0 && row.dbQty >= row.plan ? 'rgba(16,185,129,.12)' : undefined
                      }}>
                        {formatNumber(row.dbQty)}{row.dbQty > 0 && row.dbQty >= row.plan ? ' ✅' : ''}
                      </Td>
                      <Td right style={{ color: Number(row.dbUnreported) === 0 ? '#059669' : '#ea580c', fontWeight: 800 }}>{formatNumber(row.dbUnreported)}</Td>
                      <Td right>{formatNumber(row.dbPackages)}</Td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </section>
      );
    }

    function DetailTable({ rows, sortConfig, applySort, openColumn, setOpenColumn, columnFilters, setColumnFilter, onImageClick }) {
      const columns = [
        { key:'factory', label:'Factory', width: 80 },
        { key:'buyer', label:'Buyer', width: 80 },
        { key:'dest', label:'Dest', width: 60 },
        { key:'style', label:'Style Code', width: 130 },
        { key:'ao_no', label:'AO No', width: 130 },
        { key:'style_name', label:'Style Name', width: 240 },
        { key:'color_name', label:'Color', width: 130 },
        { key:'size_code', label:'Size', width: 60 },
        { key:'buyer_po', label:'Buyer PO', width: 140 },
        { key:'qty', label:'Qty', right:true, width: 90 },
        { key:'shipped_qty', label:'ĐÃ XUẤT', right:true, width: 100 },
        { key:'remain', label:'CHƯA XUẤT', right:true, width: 100 },
        { key:'mx_qty', label:'SL ĐÃ BÁO CÁO', right:true, width: 120 },
        { key:'mx_unreported', label:'CÒN LẠI', right:true, width: 100 },
        { key:'mx_packages', label:'SL PKG', right:true, width: 90 },
        { key:'exf', label:'Ngày xuất', center:true, width: 100 },
        { key:'shipping_pkg', label:'SHPPKG', width: 90 },
        { key:'prd_pkg', label:'PRDPKG', width: 100 },
        { key:'sku', label:'SKU', width: 200 },
        { key:'package_group', label:'Package Group', width: 130 },
        { key:'status', label:'Trạng thái', center:true, width: 90 }
      ];

      const [colWidths, setColWidths] = useState(() => {
        const w = {};
        columns.forEach(c => { w[c.key] = c.width; });
        return w;
      });

      const resizing = useRef(null);

      const onMouseDown = useCallback((e, key) => {
        e.preventDefault();
        resizing.current = { key, startX: e.clientX, startWidth: colWidths[key] };
        const onMouseMove = (ev) => {
          if (!resizing.current) return;
          const diff = ev.clientX - resizing.current.startX;
          const newWidth = Math.max(50, resizing.current.startWidth + diff);
          setColWidths(prev => ({ ...prev, [resizing.current.key]: newWidth }));
        };
        const onMouseUp = () => {
          resizing.current = null;
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      }, [colWidths]);

      const totalWidth = Object.values(colWidths).reduce((a, b) => a + b, 0);

      return (
        <table style={{ minWidth: totalWidth, width: '100%', fontSize: '.8125rem', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ position: 'sticky', top: 0, zIndex: 10, background: 'var(--bg-table-head)' }}>
              {columns.map(col => (
                <SortableTh key={col.key} column={col} width={colWidths[col.key]} sortConfig={sortConfig} applySort={applySort} openColumn={openColumn} setOpenColumn={setOpenColumn} columnFilters={columnFilters} setColumnFilter={setColumnFilter} onResize={onMouseDown} />
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map(row => {
              const statusOk = Boolean(row.confirmed) || upper(row.status) === 'CF';
              return (
                <tr key={row.rowKey}
                  style={{ borderBottom: `1px solid var(--border)`, transition: '.1s' }}
                  onMouseEnter={e => e.currentTarget.style.background = 'var(--bg-hover-row)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}
                >
                  <Td strong style={{ width: colWidths.factory }}>{row.factory || '-'}</Td>
                  <Td style={{ width: colWidths.buyer, color: 'var(--text-muted)' }}>{row.buyer || '-'}</Td>
                  <Td style={{ width: colWidths.dest }}>{row.dest || '-'}</Td>
                  <Td strong style={{ width: colWidths.style }}>{row.style || '-'}</Td>
                  <Td style={{ width: colWidths.ao_no }}>{row.ao_no || '-'}</Td>
                  {/* Style Name with image link */}
                  <Td style={{ width: colWidths.style_name }}>
                    {row.image_url ? (
                      <span className="style-link" onClick={() => onImageClick(row.image_url, row.styleName, row.sku, row.buyer, row.style, row.filename)}>
                        <i data-lucide="image" style={{ width: 13, height: 13, flexShrink: 0 }}></i>
                        {row.styleName || '-'}
                      </span>
                    ) : (row.styleName || '-')}
                  </Td>
                  <Td style={{ width: colWidths.color_name }}>{row.color_name || '-'}</Td>
                  <Td style={{ width: colWidths.size_code }}>{row.size_code || '-'}</Td>
                  <Td style={{ width: colWidths.buyer_po }}>{row.buyer_po || '-'}</Td>
                  {/* Highlighted numeric columns */}
                  <Td right style={{ width: colWidths.qty, fontWeight: 700, color: 'var(--accent)' }}>{formatNumber(row.qty)}</Td>
                  <Td right style={{ width: colWidths.shipped_qty, background: 'rgba(16,185,129,.08)', fontWeight: 900, color: '#059669' }}>{formatNumber(row.shipped_qty)}</Td>
                  <Td right style={{ width: colWidths.remain, background: Number(row.remain) > 0 ? 'rgba(239,68,68,.08)' : 'rgba(16,185,129,.08)', fontWeight: 900, color: Number(row.remain) > 0 ? '#dc2626' : '#059669' }}>{formatNumber(row.remain)}</Td>
                  <Td right style={{
                    width: colWidths.mx_qty, fontWeight: 700,
                    background: row.mx_qty != null && Number(row.mx_qty) >= Number(row.qty) ? 'rgba(16,185,129,.12)' : undefined,
                    color: row.mx_qty != null ? (Number(row.mx_qty) >= Number(row.qty) ? '#059669' : '#7c3aed') : 'var(--text-muted)'
                  }}>
                    {row.mx_qty != null ? <>{formatNumber(row.mx_qty)}{Number(row.mx_qty) >= Number(row.qty) ? ' ✅' : ''}</> : '-'}
                  </Td>
                  <Td right style={{
                    width: colWidths.mx_unreported, fontWeight: 800,
                    color: Number(row.mx_unreported || 0) === 0 ? '#059669' : '#ea580c'
                  }}>
                    {formatNumber(row.mx_unreported)}
                  </Td>
                  <Td right style={{ width: colWidths.mx_packages, color: row.mx_packages != null ? 'var(--text-secondary)' : 'var(--text-muted)' }}>
                    {row.mx_packages != null ? formatNumber(row.mx_packages) : '-'}
                  </Td>
                  <Td center style={{ width: colWidths.exf }}>{fmtDisplayDate(row.exf)}</Td>
                  <Td style={{ width: colWidths.shipping_pkg }}>{row.shipping_pkg || '-'}</Td>
                  <Td style={{ width: colWidths.prd_pkg }}>{row.prd_pkg || '-'}</Td>
                  <Td style={{ width: colWidths.sku, fontSize: '.75rem' }}>{row.sku || '-'}</Td>
                  <Td style={{ width: colWidths.package_group }}>{row.package_group || '-'}</Td>
                  <Td center style={{ width: colWidths.status }}>
                    <span style={{
                      display: 'inline-flex', minWidth: 44, justifyContent: 'center', padding: '4px 10px',
                      borderRadius: 999, fontSize: '.6875rem', fontWeight: 800,
                      background: statusOk ? 'rgba(16,185,129,.12)' : 'rgba(245,158,11,.12)',
                      color: statusOk ? '#059669' : '#d97706'
                    }}>{statusOk ? 'CF' : 'RO'}</span>
                  </Td>
                </tr>
              );
            })}
          </tbody>
        </table>
      );
    }

    function SortableTh({ column, width, sortConfig, applySort, openColumn, setOpenColumn, columnFilters, setColumnFilter, onResize }) {
      const active = sortConfig.key === column.key;
      const activeFilter = toText(columnFilters[column.key]);
      const align = column.right ? 'right' : column.center ? 'center' : 'left';
      return (
        <th style={{
          position: 'relative', whiteSpace: 'nowrap', padding: '10px 14px', fontWeight: 700,
          fontSize: '.6875rem', textTransform: 'uppercase', letterSpacing: '.03em',
          textAlign: align, color: 'var(--bg-table-head-text)', width: width,
          minWidth: 50, userSelect: 'none'
        }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4, justifyContent: align === 'right' ? 'flex-end' : align === 'center' ? 'center' : 'flex-start' }}>
            <span>{column.label}</span>
            <button type="button" onClick={() => setOpenColumn(openColumn === column.key ? null : column.key)}
              style={{
                background: 'none', border: 'none', cursor: 'pointer', padding: 2, borderRadius: 3,
                color: active || activeFilter ? '#fff' : 'rgba(148,163,184,.6)', fontSize: '.75rem',
                display: 'flex', alignItems: 'center'
              }}
              title="Lọc / Sắp xếp"
            >▾</button>
          </div>
          {/* Column resize handle */}
          <div className="resizer" onMouseDown={e => onResize(e, column.key)}></div>
          {/* Dropdown menu */}
          {openColumn === column.key && (
            <div className="column-menu no-print">
              <p style={{ margin: '0 0 8px', fontSize: '.6875rem', fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase' }}>{column.label}</p>
              <button type="button" onClick={() => applySort(column.key, 'asc')}>
                <i data-lucide="arrow-up-a-z" style={{ width: 15, height: 15 }}></i>Sắp xếp tăng dần
              </button>
              <button type="button" onClick={() => applySort(column.key, 'desc')}>
                <i data-lucide="arrow-down-z-a" style={{ width: 15, height: 15 }}></i>Sắp xếp giảm dần
              </button>
              <div style={{ margin: '8px 0 0', paddingTop: 8, borderTop: `1px solid var(--border)` }}>
                {column.key === 'status' ? (
                  <select value={columnFilters[column.key] || ''} onChange={e => setColumnFilter(column.key, e.target.value)}>
                    <option value="">Tất cả trạng thái</option>
                    <option value="CF">CF</option>
                    <option value="RO">RO</option>
                  </select>
                ) : (
                  <input value={columnFilters[column.key] || ''} onChange={e => setColumnFilter(column.key, e.target.value)} placeholder={`Lọc ${column.label}`} />
                )}
              </div>
              {activeFilter && (
                <button type="button" onClick={() => setColumnFilter(column.key, '')} style={{ marginTop: 8, color: '#ef4444' }}>
                  <i data-lucide="x" style={{ width: 15, height: 15 }}></i>Xóa lọc cột
                </button>
              )}
            </div>
          )}
        </th>
      );
    }

    function Th({ children, right, center }) {
      return <th style={{ textAlign: right ? 'right' : center ? 'center' : 'left', whiteSpace: 'nowrap', padding: '10px 14px', fontWeight: 700 }}>{children}</th>;
    }

    function Td({ children, right, center, strong, style = {} }) {
      return (
        <td style={{
          textAlign: right ? 'right' : center ? 'center' : 'left',
          whiteSpace: 'nowrap', padding: '10px 14px', color: 'var(--text-secondary)',
          fontWeight: strong ? 700 : 400,
          ...(strong ? { color: 'var(--text-primary)' } : {}),
          ...(right ? { fontVariantNumeric: 'tabular-nums' } : {}),
          ...style
        }}>{children}</td>
      );
    }

    function FilterChip({ label, onClear }) {
      return (
        <button onClick={onClear} type="button" style={{
          display: 'inline-flex', alignItems: 'center', gap: 6, padding: '6px 12px',
          borderRadius: 999, border: '1px solid rgba(59,130,246,.3)', background: 'rgba(59,130,246,.08)',
          color: 'var(--accent)', fontSize: '.75rem', fontWeight: 700, cursor: 'pointer'
        }}>
          {label}
          <i data-lucide="x" style={{ width: 13, height: 13 }}></i>
        </button>
      );
    }

    function StatusBadge({ confirmed, status }) {
      const ok = Boolean(confirmed) || upper(status) === 'CF';
      return (
        <span style={{
          display: 'inline-flex', minWidth: 44, justifyContent: 'center', padding: '4px 10px',
          borderRadius: 999, fontSize: '.6875rem', fontWeight: 800,
          background: ok ? 'rgba(16,185,129,.12)' : 'rgba(245,158,11,.12)',
          color: ok ? '#059669' : '#d97706'
        }}>{ok ? 'CF' : 'RO'}</span>
      );
    }

    function EmptyState({ hasData }) {
      return (
        <div style={{ display: 'flex', minHeight: 260, alignItems: 'center', justifyContent: 'center', padding: 32, textAlign: 'center' }}>
          <div>
            <div style={{ width: 48, height: 48, borderRadius: 12, margin: '0 auto 12px', background: 'var(--bg-card-alt)', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-muted)' }}>
              <i data-lucide={hasData ? 'filter-x' : 'inbox'} style={{ width: 24, height: 24 }}></i>
            </div>
            <h3 style={{ margin: '0 0 4px', fontWeight: 700, color: 'var(--text-primary)' }}>{hasData ? 'Không có dòng nào khớp bộ lọc' : 'Không có dữ liệu chi tiết'}</h3>
            <p style={{ margin: 0, fontSize: '.875rem', color: 'var(--text-muted)' }}>{hasData ? 'Thử xóa hoặc nới rộng điều kiện lọc.' : 'Hãy truy vấn lại với điều kiện khác.'}</p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
